<svg width="220" height="240" viewBox="0 0 220 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Group Body with Breathing Animation -->
  <g id="vtuber-body">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="2.8s" repeatCount="indefinite" ease="ease-in-out"/>

    <!-- Hair Back Twin Tails -->
    <path d="M45 105 C20 130 15 180 35 210 C50 185 55 145 60 115 Z" fill="url(#hairGrad)" opacity="0.95"/>
    <path d="M175 105 C200 130 205 180 185 210 C170 185 165 145 160 115 Z" fill="url(#hairGrad)" opacity="0.95"/>

    <!-- Cute Neck & Collar -->
    <path d="M100 160 L120 160 L125 185 L95 185 Z" fill="url(#skinGrad)"/>
    <path d="M85 180 L135 180 L145 235 L75 235 Z" fill="#0f172a"/>
    <path d="M98 180 L110 195 L122 180 L110 215 Z" fill="#38bdf8"/>
    <circle cx="110" cy="188" r="4" fill="#fbbf24"/>

    <!-- Head / Face -->
    <path d="M60 90 C60 50 160 50 160 90 C160 135 140 168 110 168 C80 168 60 135 60 90 Z" fill="url(#skinGrad)"/>

    <!-- Blush Cheeks -->
    <ellipse cx="78" cy="125" rx="9" ry="5" fill="#f43f5e" opacity="0.45"/>
    <ellipse cx="142" cy="125" rx="9" ry="5" fill="#f43f5e" opacity="0.45"/>
    <line x1="72" y1="124" x2="84" y2="124" stroke="#e11d48" stroke-width="1.2" opacity="0.6"/>
    <line x1="136" y1="124" x2="148" y2="124" stroke="#e11d48" stroke-width="1.2" opacity="0.6"/>

    <!-- Cute Anime Eyes (Blinking Animation) -->
    <g id="eyes">
      <g>
        <ellipse cx="85" cy="110" rx="11" ry="14" fill="#0f172a">
          <animate attributeName="ry" values="14;14;1.5;14;14" keyTimes="0;0.92;0.96;0.98;1" dur="3.5s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="85" cy="112" rx="9.5" ry="11.5" fill="url(#eyeGrad)">
          <animate attributeName="ry" values="11.5;11.5;1;11.5;11.5" keyTimes="0;0.92;0.96;0.98;1" dur="3.5s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="82" cy="106" r="4" fill="#ffffff"/>
        <circle cx="88" cy="116" r="2" fill="#ffffff"/>
        <path d="M72 104 Q85 96 98 102" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
      <g>
        <ellipse cx="135" cy="110" rx="11" ry="14" fill="#0f172a">
          <animate attributeName="ry" values="14;14;1.5;14;14" keyTimes="0;0.92;0.96;0.98;1" dur="3.5s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="135" cy="112" rx="9.5" ry="11.5" fill="url(#eyeGrad)">
          <animate attributeName="ry" values="11.5;11.5;1;11.5;11.5" keyTimes="0;0.92;0.96;0.98;1" dur="3.5s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="132" cy="106" r="4" fill="#ffffff"/>
        <circle cx="138" cy="116" r="2" fill="#ffffff"/>
        <path d="M122 102 Q135 96 148 104" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <path d="M76 96 Q85 92 94 95" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M126 95 Q135 92 144 96" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <circle cx="110" cy="128" r="1.5" fill="#ea580c" opacity="0.6"/>
    <path d="M104 140 Q110 146 116 140" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <path d="M52 82 C55 35 165 35 168 82 C168 95 158 105 152 95 C146 85 142 80 135 88 C128 95 125 105 120 90 C115 80 105 80 100 90 C95 105 92 95 85 88 C78 80 74 85 68 95 C62 105 52 95 52 82 Z" fill="url(#hairGrad)"/>
    <path d="M50 82 C45 110 50 140 55 155 C57 140 56 110 58 85 Z" fill="url(#hairGrad)"/>
    <path d="M170 82 C175 110 170 140 165 155 C163 140 164 110 162 85 Z" fill="url(#hairGrad)"/>

    <circle cx="58" cy="98" r="8" fill="#38bdf8"/>
    <circle cx="58" cy="98" r="4" fill="#0284c7"/>
    <circle cx="162" cy="98" r="8" fill="#38bdf8"/>
    <circle cx="162" cy="98" r="4" fill="#0284c7"/>

    <path d="M110 42 Q115 22 128 20 Q120 28 114 42 Z" fill="#e11d48">
      <animateTransform attributeName="transform" type="rotate" values="0 110 42; 6 110 42; -4 110 42; 0 110 42" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
