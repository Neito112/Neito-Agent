<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tileG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141d29"/>
      <stop offset="55%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#06090d"/>
    </linearGradient>
    <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55b3ff" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#00f2fe" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#ffd873" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="auraG" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity=".30"/>
      <stop offset="70%" stop-color="#0a6ea8" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eafffb"/>
      <stop offset="35%" stop-color="#7de9ff"/>
      <stop offset="100%" stop-color="#1a8fd6"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd873"/>
      <stop offset="100%" stop-color="#c8862a"/>
    </linearGradient>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- nền tile bo góc + viền sáng -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tileG)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#edgeG)" stroke-width="3"/>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1.5"/>

  <!-- quầng năng lượng -->
  <circle cx="128" cy="134" r="92" fill="url(#auraG)"/>

  <!-- vòng quỹ đạo cách điệu (điểm mạnh công nghệ) -->
  <ellipse cx="128" cy="138" rx="74" ry="26" fill="none" stroke="#55b3ff" stroke-opacity=".5" stroke-width="3" transform="rotate(-18 128 138)"/>
  <circle cx="196" cy="112" r="6" fill="url(#goldG)"/>

  <!-- ngọn lửa hồn (emblem Ni-Oh) -->
  <g filter="url(#glowF)">
    <path d="M128 44 C140 74 168 92 168 128 C168 162 150 182 128 182 C106 182 88 162 88 128 C88 92 116 74 128 44 Z"
          fill="url(#flameG)"/>
    <path d="M128 86 C135 104 148 112 148 132 C148 150 139 160 128 160 C117 160 108 150 108 132 C108 112 121 104 128 86 Z"
          fill="#f2fffd" opacity=".92"/>
  </g>

  <!-- chữ N khắc trong lõi lửa -->
  <path d="M120 120 v26 M120 120 l16 26 M136 120 v26" stroke="#0a3f63" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- chân đế -->
  <rect x="96" y="196" width="64" height="8" rx="4" fill="url(#goldG)" opacity=".9"/>
  <rect x="110" y="210" width="36" height="6" rx="3" fill="#55b3ff" opacity=".45"/>
</svg>
