<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neito Agent - Fine-tune Workspace</title>
<style>body{margin:0;background:#090b10;color:#e5f6ff;font:14px Segoe UI,system-ui;padding:24px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#121e31;border:1px solid #28435d;border-radius:12px;padding:16px;margin:12px 0}.card h2{font-size:15px;margin:0 0 8px}.ok{color:#34d399}.off{color:#fb7185}input,select,button{padding:9px;border-radius:8px;border:1px solid #385673;background:#0c1726;color:#e5f6ff}button{cursor:pointer;background:#087bb5}.search{display:flex;gap:8px}.search input{flex:1}.result{border-top:1px solid #28435d;padding:10px 0}.result a{color:#66d9ff}.muted{color:#9ab1c4;font-size:12px}</style></head>
<body><h1>Fine-tune Workspace</h1><p class="muted">Tìm dataset theo protocol. API key chỉ được đọc từ biến môi trường local; không gửi key vào prompt LLM.</p><div id="providers" class="grid"></div><div class="card"><h2>Tìm dataset</h2><div class="search"><select id="provider"><option>roboflow</option><option>kaggle</option><option>github</option><option>huggingface</option></select><input id="query" placeholder="Ví dụ: League of Legends UI detection"><input id="protocol" placeholder="Protocol ID" value="general"><button onclick="search()">Tìm</button></div><div id="results"></div></div><div class="card"><h2>Dataset đã chọn</h2><div id="manifest">Đang tải...</div></div><script>
const API='http://127.0.0.1:4242';
async function load(){const s=await fetch(API+'/api/fine-tune/providers').then(r=>r.json());document.querySelector('#providers').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><h2>${k}</h2><span class="${v.configured?'ok':'off'}">${v.configured?'Đã liên kết':'Chưa liên kết'}</span><div class="muted">${v.env}</div></div>`).join('');const m=await fetch(API+'/api/fine-tune/manifest').then(r=>r.json());document.querySelector('#manifest').innerHTML=(m.items||[]).map(x=>`<div class="result"><b>${x.provider}</b> · ${x.protocol_id} · <a href="${x.item.url}" target="_blank">${x.item.title||x.item.url}</a></div>`).join('')||'Chưa có dataset.'}
async function search(){const provider=document.querySelector('#provider').value,query=document.querySelector('#query').value,protocol_id=document.querySelector('#protocol').value;const data=await fetch(API+'/api/fine-tune/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider,query})}).then(r=>r.json());document.querySelector('#results').innerHTML=(data.results||[]).map(x=>`<div class="result"><a href="${x.url}" target="_blank">${x.title||x.id}</a> <button onclick='save(${JSON.stringify(x)},"${provider}","${protocol_id}")'>Chọn</button><div class="muted">${x.description||''}</div></div>`).join('')||data.error||'Không tìm thấy.'}
async function save(item,provider,protocol_id){await fetch(API+'/api/fine-tune/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider,item,protocol_id})});load()}load();</script></body></html>
