<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Neito Agent Overlay</title>
<!-- Live2D WebGL Dual Engine Support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.8/browser/pixi.min.js"></script>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: transparent !important;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #overlay-viewport {
    position: relative; width: 100vw; height: 100vh;
    overflow: hidden;
  }

  /* Khung thu phóng (Zoom Stage) - Hỗ trợ scale lăn chuột neo theo con trỏ */
  #zoom-stage {
    position: absolute; top: 0; left: 0;
    width: 340px; height: 460px;
    transform-origin: 0 0;
  }

  /* ══════════════════════════════════════════════════════════════════
     LỚP 4: BÓNG THOẠI (SPEECH BUBBLE)
     Luôn cố định trên đỉnh đầu nhân vật (đỉnh đầu ~270px -> đáy bóng ở 278px)
     ══════════════════════════════════════════════════════════════════ */
  .bubble {
    position: absolute; bottom: 278px; left: 16px; right: 16px;
    max-height: 130px; overflow-y: auto;
    background: rgba(15, 23, 42, 0.96);
    border: 1.5px solid #38bdf8; border-radius: 14px;
    padding: 10px 14px; color: #f0f9ff; font-size: 11.5px; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), 0 0 16px rgba(56, 189, 248, 0.35);
    opacity: 0; transform: translateY(-8px) scale(0.95); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    z-index: 80; word-break: break-word;
  }
  .bubble.show {
    opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
  }
  .bubble::after {
    content: ''; position: absolute; top: 100%; left: 50%; margin-left: -7px;
    border: 7px solid transparent; border-top-color: #38bdf8;
  }
  .bubble::-webkit-scrollbar { width: 4px; }
  .bubble::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.5); border-radius: 2px; }

  /* ══════════════════════════════════════════════════════════════════
     LỚP 2: NHÂN VẬT & MINI ICON
     Luôn cách 2 nút tròn 1 khoảng cố định (2 nút tròn ở 68px -> đáy pet ở 110px)
     Đệm background: rgba(0,0,0,0.005) để WebView2 không bao giờ bỏ qua hit-test!
     ══════════════════════════════════════════════════════════════════ */
  .zone-char {
    position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 160px;
    display: flex; align-items: flex-end; justify-content: center;
    cursor: grab; -webkit-user-drag: none; user-drag: none; user-select: none;
    background: rgba(0, 0, 0, 0.005);
    border-radius: 20px;
    z-index: 30;
  }
  .zone-char:active { cursor: grabbing !important; }

  .char-wrapper {
    width: 120px; height: 144px; position: relative;
    display: flex; align-items: flex-end; justify-content: center;
    transform-origin: 50% 100%; transition: transform 0.25s ease;
    pointer-events: auto; -webkit-user-drag: none;
  }
  .char-wrapper img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    display: block; pointer-events: auto; -webkit-user-drag: none;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6));
    cursor: grab;
  }
  .char-wrapper img:active { cursor: grabbing; }

  /* Mini Icon Badge khi thu gọn: Luôn nằm TRÊN 2 nút tròn (bottom: 110px) */
  .icon-badge {
    position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
    width: 50px; height: 50px; border-radius: 50%;
    background: radial-gradient(circle, #0284c7, #0f172a);
    border: 2px solid #38bdf8; box-shadow: 0 0 16px #38bdf8, 0 6px 16px rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    cursor: grab; z-index: 35;
    animation: iconPulse 2s infinite alternate;
  }
  .icon-badge:active { cursor: grabbing; }
  .icon-badge img { width: 34px; height: 34px; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  .icon-badge.show { display: flex; }
  @keyframes iconPulse {
    from { transform: translateX(-50%) scale(1); box-shadow: 0 0 10px #38bdf8; }
    to { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 20px #38bdf8; }
  }

  /* ══════════════════════════════════════════════════════════════════
     LỚP 1: 2 NÚT TRÒN (FLOATING BAR)
     LUÔN LUÔN CỐ ĐỊNH Ở ĐÁY (BOTTOM 68PX) - KHÔNG BAO GIỜ BỊ DỊCH CHUYỂN
     ══════════════════════════════════════════════════════════════════ */
  .floating-bar {
    position: absolute; bottom: 68px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    z-index: 100; pointer-events: auto;
  }

  .round-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(17, 24, 39, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.25);
    color: #f1f5f9; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    transition: transform 0.15s, background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
    pointer-events: auto;
  }
  .round-btn:hover {
    transform: translateY(-2px) scale(1.1); border-color: #38bdf8; color: #38bdf8; background: rgba(30, 41, 59, 0.98);
    box-shadow: 0 6px 18px rgba(56, 189, 248, 0.4);
  }
  .round-btn.active {
    background: #0284c7; border-color: #38bdf8; color: #fff;
    box-shadow: 0 0 14px #38bdf8;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981; box-shadow: 0 0 8px #10b981;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .status-dot.thinking {
    background: #f59e0b; box-shadow: 0 0 12px #f59e0b; animation: pulseDot 0.8s infinite alternate;
  }
  @keyframes pulseDot { from { opacity: 0.4; } to { opacity: 1; } }

  /* ══════════════════════════════════════════════════════════════════
     LỚP 3: Ô NHẬP CHAT (CHAT PANEL)
     XỔ XUỐNG DƯỚI 2 NÚT TRÒN (BOTTOM 10PX) - KHÔNG ĐẨY BỐ CỤC LÊN TRÊN
     ══════════════════════════════════════════════════════════════════ */
  .chat-panel {
    position: absolute; bottom: 10px; left: 16px; right: 16px;
    background: rgba(17, 24, 39, 0.97); backdrop-filter: blur(16px);
    border: 1px solid rgba(56, 189, 248, 0.55); border-radius: 12px;
    padding: 6px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.8), 0 0 12px rgba(56,189,248,0.25);
    display: none; flex-direction: column; justify-content: space-between; gap: 4px;
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 90;
  }
  .chat-panel.open {
    display: flex; opacity: 1; pointer-events: auto; transform: translateY(0);
  }
  .chat-input {
    width: 100%; min-height: 26px; max-height: 110px;
    background: transparent; border: none;
    color: #fff; font-size: 11.5px; padding: 4px 4px;
    outline: none; resize: vertical; font-family: inherit; line-height: 1.5;
    overflow-y: auto;
  }
  .chat-actions { display: flex; justify-content: space-between; align-items: center; }
  .chat-hint { font-size: 9px; color: #94a3b8; }
  .chat-send-btn {
    padding: 2px 8px; border-radius: 4px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
    color: #fff; font-size: 10px; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
    transition: transform 0.12s, filter 0.15s;
  }
  .chat-send-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

  /* ══════════════════════════════════════════════════════════════════
     LỚP 5: VÒNG CUNG CHIẾN THUẬT (RADIAL ARC MENU)
     Các nút được JS tính tọa độ hình học bán nguyệt, cách đều trên cung tròn.
     ══════════════════════════════════════════════════════════════════ */
  .arc-menu-container {
    position: absolute; inset: 0; display: none; pointer-events: none !important; z-index: 70;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .arc-menu-container.open {
    display: block; opacity: 1;
  }

  .arc-curve-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none !important; overflow: visible;
  }
  .arc-path {
    fill: none; stroke: url(#arcGlowGrad);
    stroke-width: 2; stroke-dasharray: 6 4; stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
    animation: dashMarch 20s linear infinite;
    pointer-events: none !important;
  }
  @keyframes dashMarch { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }

  .arc-btn {
    position: absolute; width: 40px; height: 40px; margin-left: -20px; margin-top: -20px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.95); border: 2px solid rgba(56, 189, 248, 0.6);
    color: #fff; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7), 0 0 10px rgba(56, 189, 248, 0.3);
    user-select: none; -webkit-user-drag: none;
    pointer-events: auto !important;
    /* Stagger pop-in animation */
    opacity: 0; transform: scale(0.3);
    transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .arc-menu-container.open .arc-btn {
    opacity: 1; transform: scale(1);
  }
  .arc-menu-container.open .arc-btn:nth-child(2) { transition-delay: 0s; }
  .arc-menu-container.open .arc-btn:nth-child(3) { transition-delay: 0.04s; }
  .arc-menu-container.open .arc-btn:nth-child(4) { transition-delay: 0.08s; }
  .arc-menu-container.open .arc-btn:nth-child(5) { transition-delay: 0.12s; }
  .arc-menu-container.open .arc-btn:nth-child(6) { transition-delay: 0.16s; }

  .arc-btn:hover {
    transform: scale(1.2) !important;
    border-color: #38bdf8; background: #0284c7;
    box-shadow: 0 0 18px #38bdf8, 0 6px 20px rgba(0,0,0,0.8);
  }
  .arc-btn.active {
    background: #0284c7; border-color: #38bdf8;
    box-shadow: 0 0 16px #38bdf8;
  }
  .arc-btn.green-active {
    background: #059669 !important; border-color: #10b981 !important;
    box-shadow: 0 0 16px #10b981 !important;
  }

  /* Tooltip */
  .arc-btn::after {
    content: attr(data-title);
    position: absolute; left: 48px; top: 50%; transform: translateY(-50%);
    background: rgba(15, 23, 42, 0.97); border: 1px solid #38bdf8;
    border-radius: 6px; padding: 4px 10px; color: #f0f9ff;
    font-size: 10.5px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }
  .arc-btn:hover::after { opacity: 1; }

  /* Keyframe Animations for Pet */
  @keyframes petBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02, 0.98); } }
  @keyframes petHop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes petBounce { 0%,100% { transform: scale(1); } 40% { transform: scale(1.08, 0.92); } 70% { transform: scale(0.96, 1.04); } }
  @keyframes petSad { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02, 0.95) translateY(4px); } }

  /* ═══ CUSTOM SCROLLBAR TOÀN CỤC ═══ */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.7); }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: rgba(56,189,248,0.4) transparent; }
</style>
</head>
<body>
<div id="overlay-viewport">
  <div id="zoom-stage">

    <!-- LỚP 4: BÓNG THOẠI -->
    <div id="bubble" class="bubble"></div>

    <!-- LỚP 2: NHÂN VẬT (NATIVE WINDOW DRAG) -->
    <div id="zone-char" class="zone-char" data-tauri-drag-region>
      <div id="char-wrapper" class="char-wrapper" data-tauri-drag-region>
        <canvas id="live2d-canvas" style="display:none; width: 100%; height: 100%; object-fit: contain; pointer-events: none;" data-tauri-drag-region></canvas>
        <img id="char-img" src="assets/characters/panda/default.gif" alt="Pet" data-tauri-drag-region />
      </div>
    </div>

    <!-- MINI ICON BADGE (KHI THU GỌN - NẰM TRÊN 2 NÚT TRÒN) -->
    <div id="icon-badge" class="icon-badge" title="Bấm để mở lại Pet" data-tauri-drag-region>
      <img id="badge-img" src="assets/characters/panda/default.gif" alt="Icon" data-tauri-drag-region />
    </div>

    <!-- LỚP 1: 2 NÚT TRÒN CỐ ĐỊNH -->
    <div id="floating-bar" class="floating-bar">
      <button id="btn-toggle-chat" class="round-btn" title="Trò chuyện">💬</button>
      <div id="status-dot" class="status-dot" title="Trạng thái Neito Agent"></div>
      <button id="btn-toggle-menu" class="round-btn" title="Menu chiến thuật">⚙️</button>
    </div>

    <!-- LỚP 3: Ô NHẬP CHAT XỔ XUỐNG DƯỚI -->
    <div id="chat-panel" class="chat-panel">
      <textarea id="chat-input" class="chat-input" placeholder="Hỏi Neito điều gì đó... (Enter để gửi)" rows="1"></textarea>
      <div class="chat-actions">
        <span class="chat-hint">Shift+Enter xuống dòng</span>
        <button id="btn-send-chat" class="chat-send-btn">
          <span>Gửi</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>

    <!-- LỚP 5: VÒNG CUNG CHIẾN THUẬT (TÍNH TOÁN HÌNH HỌC BÁN NGUYỆT) -->
    <div id="arc-menu" class="arc-menu-container">
      <svg class="arc-curve-svg" viewBox="0 0 340 460">
        <defs>
          <linearGradient id="arcGlowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
        <path id="arc-svg-path" class="arc-path" d="" />
      </svg>

      <!-- 5 Nút — vị trí do JS layoutArcMenu() tính toán cung đều -->
      <button id="btn-arc-yolo" class="arc-btn active" data-title="Bật/tắt Mắt YOLO">👁️</button>
      <button id="btn-arc-mic" class="arc-btn" data-title="Bật/tắt Micro">🎙️</button>
      <button id="btn-arc-voice" class="arc-btn active" data-title="Bật/tắt Tiếng nói">🔊</button>
      <button id="btn-arc-icon-mode" class="arc-btn" data-title="Thu nhỏ thành Icon">🙈</button>
      <button id="btn-arc-dashboard" class="arc-btn" data-title="Mở Dashboard">📊</button>
    </div>

  </div>
</div>

<script>
(function() {
  const BACKEND = 'http://127.0.0.1:4242';
  const zoomStage = document.getElementById('zoom-stage');
  const bubble = document.getElementById('bubble');
  const zoneChar = document.getElementById('zone-char');
  const charWrapper = document.getElementById('char-wrapper');
  const live2dCanvas = document.getElementById('live2d-canvas');
  const charImg = document.getElementById('char-img');
  const iconBadge = document.getElementById('icon-badge');
  const badgeImg = document.getElementById('badge-img');
  const btnToggleChat = document.getElementById('btn-toggle-chat');
  const btnToggleMenu = document.getElementById('btn-toggle-menu');
  const statusDot = document.getElementById('status-dot');
  const chatPanel = document.getElementById('chat-panel');
  const chatInput = document.getElementById('chat-input');
  const btnSendChat = document.getElementById('btn-send-chat');
  const arcMenu = document.getElementById('arc-menu');
  const btnArcYolo = document.getElementById('btn-arc-yolo');
  const btnArcMic = document.getElementById('btn-arc-mic');
  const btnArcVoice = document.getElementById('btn-arc-voice');
  const btnArcIconMode = document.getElementById('btn-arc-icon-mode');
  const btnArcDashboard = document.getElementById('btn-arc-dashboard');

  let curChar = 'hiyori';
  let curProtocol = null;
  let isIconMode = false;
  let bubbleTimer = null;
  let yoloActive = true;
  let micActive = false;
  let voiceActive = true;
  let lastAdvisorEventId = null;
  let lastSpeechId = null;
  let currentAudio = null;

  // Dual-Engine VTuber & Live2D State
  let live2dApp = null;
  let currentLive2DModel = null;
  let isLive2DActive = false;
  let petEmotionTimeout = null;

  // ══════════════════════════════════════════════════════════════════
  // 0. TÍNH TOÁN HÌNH HỌC VÒNG CUNG (ARC LAYOUT)
  //    Đặt 5 nút cách đều nhau trên cung bán nguyệt bên phải nhân vật.
  //    Tâm cung = trung tâm khung nhân vật (170, 245).
  //    Bán kính R = 130px. Góc quét: 230° → 310° (cung bên phải).
  // ══════════════════════════════════════════════════════════════════
  function layoutArcMenu() {
    const cx = 170, cy = 240;     // Tâm vòng cung (trung tâm khung nhân vật)
    const R = 128;                 // Bán kính cung
    const startDeg = 225;          // Góc bắt đầu (phía dưới bên phải)
    const endDeg = 315;            // Góc kết thúc (phía trên bên phải)
    const arcBtns = arcMenu.querySelectorAll('.arc-btn');
    const n = arcBtns.length;
    const stepDeg = (endDeg - startDeg) / (n - 1);

    // Tính tọa độ từng nút
    const points = [];
    arcBtns.forEach((btn, i) => {
      const deg = startDeg + i * stepDeg;
      const rad = deg * Math.PI / 180;
      const x = cx + R * Math.cos(rad);
      const y = cy - R * Math.sin(rad);  // Y trục ngược trong SVG/CSS
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      points.push({ x, y });
    });

    // Sinh SVG path mượt qua các điểm (đường cong Catmull-Rom → Cubic Bezier)
    if (points.length >= 2) {
      let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[Math.max(i - 1, 0)];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[Math.min(i + 2, points.length - 1)];
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      const svgPath = document.getElementById('arc-svg-path');
      if (svgPath) svgPath.setAttribute('d', d);
    }
  }
  // Gọi ngay khi khởi tạo
  layoutArcMenu();

  // ══════════════════════════════════════════════════════════════════
  // 1. KÉO THẢ NATIVE AN TOÀN TUYỆT ĐỐI (KHÔNG BAO GIỜ BAY MẤT CỬA SỔ)
  // ══════════════════════════════════════════════════════════════════
  let mouseDownPos = { x: 0, y: 0 };

  function handleDragStart(e) {
    if (e.button !== 0) return;
    if (e.target.closest('button') || e.target.closest('textarea') || e.target.closest('input')) return;
    mouseDownPos = { x: e.screenX, y: e.screenY };

    // Kích hoạt native OS window drag (chuẩn của Tauri, Windows tự quản lý mượt mà)
    if (window.__TAURI__ && window.__TAURI__.core) {
      window.__TAURI__.core.invoke('start_drag').catch(() => {});
    }
  }

  zoneChar.addEventListener('mousedown', handleDragStart);
  iconBadge.addEventListener('mousedown', handleDragStart);

  // Click vào nhân vật Pet để tương tác và cất tiếng nói
  zoneChar.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.closest('textarea') || e.target.closest('input')) return;
    if (Math.abs(e.screenX - mouseDownPos.x) < 5 && Math.abs(e.screenY - mouseDownPos.y) < 5) {
      onPetClick();
    }
  });

  // Click vào icon badge khi không di chuyển để khôi phục
  iconBadge.addEventListener('click', (e) => {
    if (Math.abs(e.screenX - mouseDownPos.x) < 5 && Math.abs(e.screenY - mouseDownPos.y) < 5) {
      toggleIconMode();
    }
  });

  // ══════════════════════════════════════════════════════════════════
  // 2. THU PHÓNG (ZOOM SCALE) BẰNG CON LĂN CHUỘT NEO THEO CON TRỎ
  // ══════════════════════════════════════════════════════════════════
  let scale = 1.0;
  let transX = 0;
  let transY = 0;

  window.addEventListener('wheel', (e) => {
    if (e.target.closest('#bubble') || e.target.closest('#chat-panel')) {
      return;
    }
    e.preventDefault();

    const mouseX = e.clientX;
    const mouseY = e.clientY;
    const zoomFactor = e.deltaY < 0 ? 1.06 : 0.94;
    const newScale = Math.min(Math.max(scale * zoomFactor, 0.65), 1.65);
    if (newScale === scale) return;

    transX = mouseX - (mouseX - transX) * (newScale / scale);
    transY = mouseY - (mouseY - transY) * (newScale / scale);
    scale = newScale;

    zoomStage.style.transform = `translate(${transX}px, ${transY}px) scale(${scale})`;
  }, { passive: false });

  window.addEventListener('dblclick', (e) => {
    if (e.target.closest('button') || e.target.closest('textarea')) return;
    scale = 1.0;
    transX = 0;
    transY = 0;
    zoomStage.style.transform = 'translate(0px, 0px) scale(1)';
  });

  // ══════════════════════════════════════════════════════════════════
  // 3. ĐỒNG BỘ NHÂN VẬT & GIAO THỨC TÁC CHIẾN TỪ BRAIN
  // ══════════════════════════════════════════════════════════════════
  const CHAR_NAMES = {
    hiyori: 'Hiyori Momose (VTuber Anime)',
    panda: 'Gấu Trúc Panda',
    cat: 'Mèo Con Cute',
    clippy: 'Kẹp Giấy Clippy',
    dog: 'Cún Cưng',
    duck: 'Vịt Vàng',
    fox: 'Cáo Lửa',
    rocky: 'Hòn Đá Rocky',
    totoro: 'Thần Rừng Totoro'
  };

  // Di chuyển Pet đến vị trí cần người dùng chú ý (Locomotion / Attention Gliding)
  function triggerAttentionGlide(targetX, targetY, durMs = 650, returnAfterMs = 3500, reason = '') {
    if (window.__TAURI__ && window.__TAURI__.core && typeof targetX === 'number' && typeof targetY === 'number') {
      console.log(`[Locomotion] Gliding pet to (${targetX}, ${targetY}) - Reason: ${reason}`);
      window.__TAURI__.core.invoke('glide_pet_to', {
        targetX: Number(targetX),
        targetY: Number(targetY),
        durationMs: Number(durMs || 650),
        returnAfterMs: Number(returnAfterMs || 3500)
      }).catch(err => {
        console.warn('[Locomotion error]:', err);
      });
    }
  }

  // Nhận diện cử chỉ / cảm xúc tương ứng ngữ nghĩa của câu nói (Semantic Speech Gestures)
  function parseSpeechGestures(text) {
    if (!text) return 'talk';
    const t = text.toLowerCase();
    if (/(chào|hello|hi\b|hế lô|hé lô|kính chào|bái bai|hẹn gặp|em chào|xin chào|sếp ơi)/i.test(t)) return 'wave';
    if (/(chúc mừng|thắng rồi|tuyệt vời|đỉnh chóp|quá đỉnh|haha|yeah|hoan hô|tốt lắm|chiến thắng|hay lắm|chuẩn luôn|sướng|chiến|win)/i.test(t)) return 'happy';
    if (/(cẩn thận|nguy hiểm|gank|chú ý|cảnh báo|báo động|lỗi|mất máu|chết|địch|kẻ địch|coi chừng|nguy cấp|thua)/i.test(t)) return 'shock';
    if (/(đang suy nghĩ|để em xem|tra cứu|phân tích|xem nào|tìm hiểu|nghiên cứu|chờ xíu|đợi tí|thống kê|để em tra|kiểm tra)/i.test(t)) return 'think';
    return 'talk';
  }

  // Dual-Engine Emotion Controller (Live2D WebGL + Multi-State Sprite PNGTuber)
  function setPetEmotion(emotion, ms) {
    // 1. Live2D Engine
    if (isLive2DActive && currentLive2DModel) {
      try {
        currentLive2DModel.expression(emotion);
      } catch(e) {}
      if (ms) {
        clearTimeout(petEmotionTimeout);
        petEmotionTimeout = setTimeout(() => {
          try { currentLive2DModel.expression('idle'); } catch(e) {}
        }, ms);
      }
      return;
    }

    // 2. Multi-State Sprite Engine (Hiyori VTuber)
    if (curChar === 'hiyori') {
      const spriteMap = {
        'idle': 'idle.svg',
        'talk': 'talk.svg',
        'happy': 'happy.svg',
        'cheer': 'happy.svg',
        'wave': 'wave.svg',
        'shock': 'shock.svg',
        'alert': 'shock.svg',
        'think': 'think.svg',
        'curious': 'think.svg',
        'sad': 'shock.svg'
      };
      const file = spriteMap[emotion] || 'idle.svg';
      charImg.src = `assets/characters/${curChar}/${file}`;

      setAnim(emotion === 'happy' || emotion === 'cheer' ? 'hop' : emotion === 'shock' || emotion === 'alert' ? 'bounce' : 'idle', ms);

      if (ms && emotion !== 'idle') {
        clearTimeout(petEmotionTimeout);
        petEmotionTimeout = setTimeout(() => {
          if (curChar === 'hiyori') {
            charImg.src = `assets/characters/${curChar}/idle.svg`;
            setAnim('idle');
          }
        }, ms);
      }
    } else {
      // Legacy animation fallback (Panda, Cat, etc.)
      setAnim(emotion, ms);
    }
  }

  async function syncStatus() {
    try {
      const res = await fetch(BACKEND + '/api/status');
      if (res.ok) {
        const data = await res.json();
        // Đồng bộ nhân vật
        if (data.current_character && data.current_character !== curChar) {
          await setCharacter(data.current_character, true);
        }
        // Đồng bộ giao thức tác chiến & thông báo khi đổi App On-Top
        if (data.active_protocol && (!curProtocol || curProtocol.id !== data.active_protocol.id)) {
          const oldName = curProtocol ? curProtocol.name : null;
          curProtocol = data.active_protocol;
          if (oldName && curProtocol.id !== 'general') {
            setPetEmotion('wave', 2500);
            const appLabel = curProtocol.appName || curProtocol.name;
            showBubble(`⚔️ Phát hiện Sếp đang mở [${appLabel}]! Em tự động chuyển sang Giao thức: ${curProtocol.name}!`);
          }
        }
        // Đồng bộ mắt YOLO
        if (typeof data.yolo_active === 'boolean' && data.yolo_active !== yoloActive) {
          yoloActive = data.yolo_active;
          btnArcYolo.classList.toggle('active', yoloActive);
        }
      }
    } catch(e) {}
  }

  // Lắng nghe Quân sư YOLO-World khi đang chơi game (Đồng bộ hoạt ảnh và di chuyển chú ý)
  async function pollAdvisor() {
    try {
      const res = await fetch(BACKEND + '/api/advisor/latest');
      if (res.ok) {
        const data = await res.json();
        const evt = data.event;
        if (evt && evt.event_id && evt.event_id !== lastAdvisorEventId) {
          lastAdvisorEventId = evt.event_id;
          if (evt.attention_point && typeof evt.attention_point.x === 'number') {
            triggerAttentionGlide(evt.attention_point.x, evt.attention_point.y, 650, 3500, evt.advice);
          }
          if (evt.type === 'known_situation') {
            setPetEmotion('alert', 4000);
          } else if (evt.type === 'new_learned_situation') {
            setPetEmotion('think', 5000);
          }
        }
      }
    } catch(e) {}
  }

  async function setCharacter(name, notify) {
    if (!name || name === 'default') name = 'hiyori';
    curChar = name;
    if (petEmotionTimeout) clearTimeout(petEmotionTimeout);

    // Kiểm tra và tải Live2D nếu có file model3.json
    let loadedLive2D = false;
    if (window.PIXI && window.PIXI.live2d) {
      try {
        const modelPath = `assets/characters/${name}/${name}.model3.json`;
        const res = await fetch(modelPath, { method: 'HEAD' });
        if (res.ok) {
          if (!live2dApp) {
            live2dApp = new PIXI.Application({
              view: live2dCanvas,
              transparent: true,
              autoStart: true,
              backgroundAlpha: 0,
              width: 140,
              height: 160
            });
          }
          if (currentLive2DModel) {
            live2dApp.stage.removeChild(currentLive2DModel);
            currentLive2DModel.destroy();
            currentLive2DModel = null;
          }
          currentLive2DModel = await PIXI.live2d.Live2DModel.from(modelPath);
          currentLive2DModel.scale.set(0.18);
          currentLive2DModel.x = 10;
          currentLive2DModel.y = 10;
          live2dApp.stage.addChild(currentLive2DModel);
          live2dCanvas.style.display = 'block';
          charImg.style.display = 'none';
          isLive2DActive = true;
          loadedLive2D = true;
        }
      } catch(e) {}
    }

    if (!loadedLive2D) {
      isLive2DActive = false;
      live2dCanvas.style.display = 'none';
      charImg.style.display = 'block';

      if (name === 'hiyori') {
        charImg.src = `assets/characters/${name}/idle.svg`;
        badgeImg.src = `assets/characters/${name}/default.svg`;
      } else {
        const ext = (name === 'cat') ? 'default.svg' : 'default.gif';
        const p = `assets/characters/${name}/${ext}`;
        charImg.src = p;
        badgeImg.src = p;
      }
    }

    setPetEmotion('idle');

    if (notify) {
      setPetEmotion('wave', 2500);
      showBubble(`Em đã đổi sang nhân vật: ${CHAR_NAMES[name] || name} rồi nhé! ✨`);
    }
  }

  charImg.onerror = () => {
    charImg.src = 'assets/characters/hiyori/default.svg';
  };

  function setAnim(animName, ms) {
    charWrapper.style.animation = 'none';
    if (!animName || animName === 'idle') {
      charWrapper.style.animation = 'petBreathe 3s ease-in-out infinite';
      return;
    }
    const animMap = {
      'hop': 'petHop 0.8s ease-in-out infinite',
      'bounce': 'petBounce 1s ease-in-out infinite',
      'happy': 'petHop 0.8s ease-in-out infinite',
      'sad': 'petSad 2s ease-in-out infinite',
      'alert': 'petBounce 0.6s ease-in-out infinite',
      'curious': 'petBreathe 1.5s ease-in-out infinite'
    };
    charWrapper.style.animation = animMap[animName] || 'petBreathe 3s ease-in-out infinite';
    if (ms) {
      setTimeout(() => {
        charWrapper.style.animation = 'petBreathe 3s ease-in-out infinite';
      }, ms);
    }
  }

  function onPetClick() {
    setPetEmotion('happy', 2500);
    const pName = curProtocol ? curProtocol.name : 'Chiến thuật chung';
    const greetings = [
      `Dạ em đây Sếp ơi! Em đang quan sát và hỗ trợ Sếp trong [${pName}]! ✨`,
      `Quân sư Neito sẵn sàng tác chiến! Sếp bảo gì em làm ngay nhé! ⚔️`,
      `Em đang túc trực bên cạnh Sếp đây ạ! Mọi biến động trên màn hình em đều nắm rõ! 💖`
    ];
    const pick = greetings[Math.floor(Math.random() * greetings.length)];
    showBubble(pick);
  }

  function speakVoice(text) {
    if (!voiceActive || !('speechSynthesis' in window) || !text) return;
    try {
      window.speechSynthesis.cancel();
      const clean = text.replace(/[\u{1F300}-\u{1FAFF}]/gu, '').trim();
      if (!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'vi-VN';
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  function playSpeechAndBubble(text, emotion = 'happy', spokenText = '', attentionPoint = null) {
    if (!text) return;
    const gesture = parseSpeechGestures(text) || emotion || 'talk';

    // Xử lý chú ý & di chuyển Pet (Attention Locomotion)
    if (attentionPoint && typeof attentionPoint.x === 'number' && typeof attentionPoint.y === 'number') {
      triggerAttentionGlide(
        attentionPoint.x,
        attentionPoint.y,
        attentionPoint.duration_ms || 650,
        attentionPoint.return_after_ms || 3500,
        text
      );
    }

    const cleanSpoken = spokenText || text.replace(/[\u{1F300}-\u{1FAFF}]/gu, '').replace(/[⚔️👁️🎙️🔊🔇💡ℹ️⚠️❌🟢🔴🤖👤🧠👉✨🎮📌📊⏳💖]/g, '').trim();

    let bubbleShown = false;
    const triggerBubble = () => {
      if (!bubbleShown) {
        bubbleShown = true;
        bubble.textContent = text;
        bubble.classList.add('show');
        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => {
          bubble.classList.remove('show');
        }, Math.max(5500, text.length * 85));
      }
    };

    if (voiceActive && cleanSpoken) {
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        const audioUrl = BACKEND + '/api/speech/tts?text=' + encodeURIComponent(cleanSpoken);
        const audio = new Audio(audioUrl);
        currentAudio = audio;

        // Cơ chế Lip-Sync & Semantic Gesture:
        // Khi audio bắt đầu phát -> Kích hoạt cử chỉ và khẩu hình mở miệng nói
        audio.onplay = () => {
          triggerBubble();
          setPetEmotion(gesture);
        };
        // Khi đọc xong -> Trở về trạng thái thở nhẹ idle
        audio.onended = () => {
          setTimeout(() => {
            setPetEmotion('idle');
          }, 250);
        };
        audio.onerror = () => {
          triggerBubble();
          setPetEmotion(gesture, Math.max(3000, text.length * 80));
          speakVoice(cleanSpoken);
        };
        audio.play().catch(() => {
          triggerBubble();
          setPetEmotion(gesture, Math.max(3000, text.length * 80));
          speakVoice(cleanSpoken);
        });

        setTimeout(triggerBubble, 350);
        return;
      } catch (e) {
        // Fallback
      }
    }

    triggerBubble();
    setPetEmotion(gesture, Math.max(3000, text.length * 80));
  }

  function showBubble(text) {
    playSpeechAndBubble(text, 'happy', '');
  }

  async function pollSpeech() {
    try {
      const res = await fetch(BACKEND + '/api/speech/latest');
      if (res.ok) {
        const data = await res.json();
        const evt = data.event;
        if (evt && evt.id && evt.id !== lastSpeechId) {
          lastSpeechId = evt.id;
          playSpeechAndBubble(evt.text, evt.emotion || 'happy', evt.spoken_text || '', evt.attention_point);
        }
      }
    } catch(e) {}
  }
  bubble.addEventListener('click', () => bubble.classList.remove('show'));

  // ══════════════════════════════════════════════════════════════════
  // 4. BẬT/TẮT CHAT (XỔ XUỐNG DƯỚI 2 NÚT TRÒN)
  // ══════════════════════════════════════════════════════════════════
  btnToggleChat.addEventListener('click', (e) => {
    e.stopPropagation();
    arcMenu.classList.remove('open');
    btnToggleMenu.classList.remove('active');
    const open = chatPanel.classList.toggle('open');
    btnToggleChat.classList.toggle('active', open);
    if (open) {
      setTimeout(() => chatInput.focus(), 50);
    }
  });

  function closeChat() {
    chatPanel.classList.remove('open');
    btnToggleChat.classList.remove('active');
  }

  // ══════════════════════════════════════════════════════════════════
  // 5. BẬT/TẮT VÒNG CUNG
  // ══════════════════════════════════════════════════════════════════
  btnToggleMenu.addEventListener('click', (e) => {
    e.stopPropagation();
    closeChat();
    const open = arcMenu.classList.toggle('open');
    btnToggleMenu.classList.toggle('active', open);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#chat-panel') && !e.target.closest('#btn-toggle-chat')) {
      closeChat();
    }
    if (!e.target.closest('.arc-btn') && !e.target.closest('#btn-toggle-menu')) {
      arcMenu.classList.remove('open');
      btnToggleMenu.classList.remove('active');
    }
  });

  // 5 Nút trên vòng cung
  btnArcYolo.addEventListener('click', (e) => {
    e.stopPropagation();
    yoloActive = !yoloActive;
    btnArcYolo.classList.toggle('active', yoloActive);
    fetch(BACKEND + '/api/yolo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ active: yoloActive })
    }).catch(() => {});
    if (yoloActive) {
      const pName = curProtocol ? curProtocol.name : 'Chiến thuật chung';
      showBubble(`👁️ Mắt YOLO đã bật! Quân sư đang soi màn hình cho [${pName}].`);
      setAnim('alert', 4000);
    } else {
      showBubble('👁️ Đã tắt mắt quan sát YOLO.');
      setAnim('idle', 2000);
    }
  });

  btnArcMic.addEventListener('click', (e) => {
    e.stopPropagation();
    micActive = !micActive;
    btnArcMic.classList.toggle('green-active', micActive);
    if (micActive) {
      showBubble('🎙️ Micro đã bật! Em đang lắng nghe giọng nói của Sếp...');
      setAnim('curious', 4000);
    } else {
      showBubble('🎙️ Micro đã tắt.');
      setAnim('idle', 2000);
    }
  });

  btnArcVoice.addEventListener('click', (e) => {
    e.stopPropagation();
    voiceActive = !voiceActive;
    if (voiceActive) {
      btnArcVoice.textContent = '🔊';
      btnArcVoice.classList.add('active');
      showBubble('🔊 Đã bật giọng nói của Pet! Em sẽ trò chuyện bằng âm thanh với Sếp.');
      setAnim('happy', 3000);
    } else {
      btnArcVoice.textContent = '🔇';
      btnArcVoice.classList.remove('active');
      showBubble('🔇 Đã tắt tiếng. Em sẽ giao tiếp qua bóng thoại nhé!');
      setAnim('idle', 2000);
    }
  });

  function toggleIconMode() {
    isIconMode = !isIconMode;
    if (isIconMode) {
      zoneChar.style.display = 'none';
      bubble.classList.remove('show');
      closeChat();
      arcMenu.classList.remove('open');
      btnToggleMenu.classList.remove('active');
      iconBadge.classList.add('show');
      btnArcIconMode.setAttribute('data-title', 'Phóng to nhân vật');
      showBubble('Em thu gọn thành Icon mini đây! Bấm vào Icon để em bung to lại nhé! ✨');
    } else {
      zoneChar.style.display = 'flex';
      iconBadge.classList.remove('show');
      btnArcIconMode.setAttribute('data-title', 'Thu nhỏ thành Icon');
      setAnim('bounce', 2000);
      showBubble('Em đã trở lại kích thước bình thường rồi đây ạ! 💖');
    }
  }

  btnArcIconMode.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleIconMode();
  });

  btnArcDashboard.addEventListener('click', (e) => {
    e.stopPropagation();
    if (window.__TAURI__ && window.__TAURI__.core) {
      window.__TAURI__.core.invoke('open_dashboard');
    }
    arcMenu.classList.remove('open');
    btnToggleMenu.classList.remove('active');
    showBubble('📊 Đang mở Tactical Dashboard cho Sếp...');
    setAnim('happy', 3000);
  });

  // ══════════════════════════════════════════════════════════════════
  // 6. GỬI CÂU HỎI LÊN BRAIN
  // ══════════════════════════════════════════════════════════════════
  async function sendQuestion() {
    const q = chatInput.value.trim();
    if (!q) return;

    chatInput.value = '';
    closeChat();
    showBubble(`"${q}"... Đợi em xíu nhé! ⏳`);
    statusDot.className = 'status-dot thinking';
    setAnim('curious');

    try {
      const res = await fetch(BACKEND + '/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, character: curChar })
      });
      if (res.ok) {
        const data = await res.json();
        statusDot.className = 'status-dot';
        const reply = data.answer || data.reply || 'Dạ em đã nhận được rồi ạ!';
        showBubble(reply);
        if (data.emotion) setPetEmotion(data.emotion, 5000);
        if (data.guide_point) {
          if (window.__TAURI__ && window.__TAURI__.core) {
            window.__TAURI__.core.invoke('trigger_ghost_pointer', {
              targetX: Number(data.guide_point.x),
              targetY: Number(data.guide_point.y)
            });
          }
          triggerAttentionGlide(Number(data.guide_point.x), Number(data.guide_point.y), 650, 3500, 'Chat guide point');
        }
      } else {
        throw new Error('Server error');
      }
    } catch(e) {
      statusDot.className = 'status-dot';
      showBubble('Ôi Sếp ơi, hình như máy chủ Brain chưa phản hồi kịp! Sếp kiểm tra giúp em nhé!');
      setPetEmotion('shock', 4000);
    }
  }

  btnSendChat.addEventListener('click', sendQuestion);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  // Khởi chạy với nhân vật Anime VTuber Hiyori
  setCharacter('hiyori', false);
  setPetEmotion('idle');
  // Đồng bộ trạng thái Always-On ngay khi khởi động
  yoloActive = true;
  voiceActive = true;
  btnArcYolo.classList.add('active');
  btnArcVoice.textContent = '🔊';
  btnArcVoice.classList.add('active');
  syncStatus();
  setInterval(syncStatus, 2000);
  setInterval(pollAdvisor, 2500);
  setInterval(pollSpeech, 1200);  // Lắng nghe Speech Queue từ brain
  setTimeout(() => {
    showBubble('Em chào Sếp! Neito Tactical Companion đã sẵn sàng tác chiến! ✨');
  }, 1000);
})();
</script>
</body>
</html>
