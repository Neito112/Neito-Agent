<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ni-Oh Overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent !important; overflow: hidden; width:100%; height:100%; }
  body {
    font-family:'Segoe UI',system-ui,sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  body.over-char { cursor: grab; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  /* ═══ WRAPPER SCALE ĐỒNG BỘ (nhân vật + nút + popup). Khung chat NGOÀI wrapper. ═══ */
  #zoomwrap {
    position:absolute; top:0; left:0; width:240px;
    transform-origin: 0 0;
    display:flex; flex-direction:column; align-items:center;
  }
  .bubble-space { width:100%; height:122px; flex:none; }

  /* ── Bong bóng thoại: absolute trong wrap, bottom do JS set (bám đỉnh đầu) ── */
  .bubble {
    position:absolute; left:10px; right:10px; bottom:232px; z-index:5;
    max-height: 116px; overflow: hidden;
    background: rgba(15,23,42,.95);
    border:1px solid #8fb4ec; border-radius:12px;
    padding:7px 10px;
    color:#eaf2ff; font-size:12px; line-height:1.45;
    opacity:0; pointer-events:none;
    transition: opacity .25s, transform .25s, bottom .35s cubic-bezier(.22,1,.36,1);
    box-shadow:0 6px 24px rgba(0,0,0,.5);
    transform: translateY(-6px) scale(.96);
  }
  .bubble.show { opacity:1; transform: translateY(0) scale(1); }
  .bubble::after {
    content:''; position:absolute; top:100%; left:50%; margin-left:-6px;
    border:6px solid transparent; border-top-color:#8fb4ec;
  }

  /* ── VÙNG nhân vật: cao độ CỐ ĐỊNH — ẩn/hiện không làm xê dịch hàng nút ── */
  .zone-char { position:relative; width:100%; height:176px; flex:none; }
  .char {
    position:absolute; left:50%; bottom:0; margin-left:-60px;
    width:120px; height:144px;
    transform-origin: 50% 100%;
    transition: transform .38s cubic-bezier(.34,1.3,.64,1), opacity .3s;
  }
  body.no-char .char { transform: scale(.3) translateY(30px); opacity:0; }
  .floaty { width:100%; height:100%; }   /* VAT THE NAM DAT — khong bay; 'tho' .squish body lo */
  @keyframes float { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .char img { width:100%; height:100%; object-fit:contain; }
  svg.character { width:100%; height:100%; display:block; overflow:visible; }

  .slime-body { transform-box:fill-box; transform-origin:center bottom; }
  .eyes-open { transform-box:fill-box; transform-origin:center; animation: blink 4.5s ease-in-out infinite; }
  .glint { animation: glow 2.8s ease-in-out infinite; }
  @keyframes blink { 0%,41%,45%,100%{ transform:scaleY(1);} 43%{ transform:scaleY(.08);} }
  @keyframes glow { 0%,100%{ opacity:.6;} 50%{ opacity:1;} }
  @keyframes breathe { 0%,100%{ transform:scale(1,1);} 50%{ transform:scale(1.025,.975);} }
  @keyframes march { 0%,100%{ transform:translateX(-6px) rotate(-2deg);} 50%{ transform:translateX(6px) rotate(2deg);} }
  @keyframes boing { 0%,100%{ transform:scale(1,1);} 30%{ transform:scale(1.14,.82);} 60%{ transform:scale(.92,1.1);} }
  @keyframes hop { 0%,100%{ transform:translateY(0) scale(1,1);} 30%{ transform:translateY(-10px) scale(.96,1.06);} 55%{ transform:translateY(0) scale(1.08,.9);} }
  @keyframes rock { 0%,100%{ transform:rotate(-6deg);} 50%{ transform:rotate(6deg);} }
  @keyframes droop { 0%,100%{ transform:translateY(3px) scaleY(.95);} 50%{ transform:translateY(5px) scaleY(.93);} }
  @keyframes shiver { 0%,100%{ transform:translateX(-2px);} 50%{ transform:translateX(2px);} }
  @keyframes lean { 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(8deg) translateY(2px);} }
  @keyframes tilt { 0%,100%{ transform:rotate(-9deg);} 50%{ transform:rotate(-6deg);} }
  @keyframes pop { 0%,100%{ transform:scale(1,1);} 35%{ transform:scale(.9,1.18);} 70%{ transform:scale(1.06,.94);} }
  @keyframes nodding { 0%,100%{ transform:translateY(0);} 30%{ transform:translateY(5px) scaleY(.96);} 60%{ transform:translateY(-2px);} }
  @keyframes shaking { 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-8deg);} 75%{ transform:rotate(8deg);} }
  @keyframes doze { 0%,100%{ transform:rotate(-2deg) scaleY(.94);} 50%{ transform:rotate(2deg) scaleY(.92);} }
  @keyframes sway { 0%,100%{ transform:rotate(-3deg);} 50%{ transform:rotate(3deg);} }
  @keyframes spinT { 0%{ transform:scaleX(1) scale(1); filter:brightness(1);} 45%{ transform:scaleX(-1) scale(.72); filter:brightness(2.4);} 55%{ transform:scaleX(-1) scale(.72) rotate(8deg); filter:brightness(2.4);} 100%{ transform:scaleX(1) scale(1); filter:brightness(1);} }
  @keyframes tremble { 0%,100%{ transform:translate(-3px,1px) rotate(-1deg);} 50%{ transform:translate(3px,-1px) rotate(1deg);} }
  @keyframes rise { 0%{ transform:translateY(0); opacity:.85;} 100%{ transform:translateY(-24px); opacity:0;} }
  @keyframes talk { from { transform: scaleY(.3);} to { transform: scaleY(1.25);} }
  .drop { animation: rise 2.6s ease-in-out infinite; }
  /* mọi nhóm biểu cảm TẮT mặc định — JS bật theo data-emo (bảng NIOH_EMOTIONS) */
  .face g, .slime-body g, .slime-body path, .slime-body ellipse, .slime-body circle, .slime-body text { }
  .eyes-happy,.eyes-laugh,.eyes-closed,.eyes-sad,.brow-sad,.eyes-cry,.tears,.eyes-wide,.eyes-alert,.eyes-spiral,
  .eyes-uneven,.eyes-up,.eyes-wink,.eyes-love,.eyes-angry,.eyes-sparkle,.eyes-half,
  .m-omega,.m-smile,.m-grin,.m-laugh,.m-frown,.m-cry,.m-wave,.m-o,.m-flat,.m-big,.m-smirk,
  .blush,.blush-strong,.bub,.zzz,.sparkles,.hearts,.qmark,.exmark,.sweat,.steam,.sigh,.notes,.flash ,.eyes-cool{ display:none; }
  .eyes-open { display:block; }
  .m-omega { display:block; }
  .puddle { transform-box:fill-box; transform-origin:center; animation: puddle 3.6s ease-in-out infinite; }
  @keyframes puddle { 0%,100%{ transform:scaleX(1); opacity:.4;} 50%{ transform:scaleX(1.05); opacity:.48;} }
  /* máy biểu cảm: JS chèn rules theo NIOH_EMOTIONS vào #emo-style */
  #char[data-emo="talk"] .m-o { display:block; animation: talk .26s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
  #char[data-emo="talk"].lipsync .m-o { animation:none; }
  #char[data-emo="transform"] .slime-body { animation: spinT .9s ease-in-out; }
  #char[data-emo="transform"] .flash { display:block; animation: flashA .9s ease-in-out; }
  @keyframes flashA { 0%,100%{ opacity:0;} 45%,55%{ opacity:.85;} }
  .pupL,.pupR { transition: transform .18s ease-out; }

  /* avatar đại diện khi ẩn — pop vào đúng chỗ nhân vật co lại */
  .mini-avatar {
    position:absolute; left:50%; bottom:8px; margin-left:-23px;
    width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #dcecfb, #9ec1ee 45%, #6d97dd);
    border:2px solid rgba(143,180,236,.7);
    box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 2px 6px rgba(255,255,255,.5);
    cursor:grab;
    transform: scale(0); opacity:0;
    transition: transform .32s cubic-bezier(.34,1.56,.64,1) .12s, opacity .2s .12s;
  }
  .mini-avatar:active { cursor:grabbing; }
  body.no-char .mini-avatar { transform: scale(1); opacity:1; }
  .mini-avatar::before, .mini-avatar::after {
    content:''; position:absolute; top:17px; width:4px; height:6px; border-radius:50%; background:#2c4f7c;
  }
  .mini-avatar::before { left:13px; } .mini-avatar::after { right:13px; }
  .mini-avatar .sm {
    position:absolute; left:50%; top:25px; transform:translateX(-50%);
    width:12px; height:6px; border:2px solid #2c4f7c; border-top:none; border-radius:0 0 12px 12px;
  }

  /* ── 2 nút tròn nổi (scale cùng nhân vật) ── */
  .zone-bar { position:relative; width:100%; flex:none; margin-top:8px;
    display:flex; justify-content:center; }
  .bar-main { display:flex; align-items:center; gap:8px; }
  .btn {
    width:22px; height:22px; border-radius:50%; flex:none;
    background: rgba(22,27,34,.92); color:#c9d1d9;
    border:1px solid #30363d; font-size:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    transition: border-color .15s, background .15s, transform .12s;
  }
  .btn:hover { border-color:#8fb4ec; background:#1f2937; transform: translateY(-1px); }
  .btn.active { border-color:#7dd3fc; color:#7dd3fc; background: rgba(125,211,252,.16); }
  .state-dot { width:6px; height:6px; border-radius:50%; background:#ff5a5a;
    box-shadow:0 0 6px rgba(255,90,90,.8); flex:none; transition:background .2s, box-shadow .2s; }
  .state-dot.on { background:#3fb950; box-shadow:0 0 6px #3fb950; }

  /* popup nút chức năng — có ô % kích thước nhập được */
  .zone-func { position:relative; width:100%; flex:none; display:none; justify-content:center; margin-top:8px; }
  .zone-func.open { display:flex; }
  .func-box {
    display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:999px;
    background:linear-gradient(180deg, rgba(27,28,30,.88), rgba(16,17,18,.92));
    backdrop-filter: blur(14px) saturate(1.15);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    animation: popIn .2s cubic-bezier(.22,1,.36,1);
  }
  .scale-wrap { display:flex; align-items:center; gap:3px; margin-right:2px; }
  .scale-input {
    width:42px; background:rgba(7,8,10,.7); border:1px solid rgba(255,255,255,.08);
    border-radius:6px; color:#f9f9f9; font-size:10px; font-family:inherit;
    padding:3px 2px; text-align:center; outline:none; appearance:textfield; -moz-appearance:textfield;
  }
  .scale-input::-webkit-inner-spin-button, .scale-input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .scale-input:focus { border-color:rgba(85,179,255,.6); }
  .scale-pct { font-size:9px; color:#8b949e; }

  /* ══ KHUNG CHAT — ngoài wrapper scale: UI 80% cố định, chỉ khung co giãn ══ */
  .zone-chat { position:absolute; left:0; right:0; top:0; display:none;
    justify-content:center; margin-top:8px; }
  .zone-chat.open { display:flex; }
  .chat-panel {
    position:relative; width:224px;
    display:flex; gap:5px; align-items:flex-end;
    background:linear-gradient(180deg, rgba(27,28,30,.88), rgba(16,17,18,.92));
    backdrop-filter: blur(14px) saturate(1.15);
    border:1px solid rgba(255,255,255,.06); border-radius:10px;
    padding:5px;
    box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    transition:border-color .18s;
    animation: popIn .2s cubic-bezier(.22,1,.36,1);
  }
  @keyframes popIn { from { opacity:0; transform:translateY(-6px) scale(.97); } to { opacity:1; transform:none; } }
  .chat-panel:focus-within { border-color:rgba(85,179,255,.35); }
  .chat-input {
    flex:1; min-width:0; min-height:21px; max-height:130px;
    background:rgba(7,8,10,.6); border:1px solid rgba(255,255,255,.05); border-radius:6px;
    color:#f9f9f9; font-size:10px; padding:4px 6px; outline:none;
    resize:none; overflow-y:auto; font-family:inherit; line-height:1.4;
    white-space:pre-wrap; word-break:break-word;
    transition:border-color .18s;
  }
  .chat-input:hover { border-color:rgba(255,255,255,.10); }
  .chat-input:focus { border-color:rgba(85,179,255,.6); }
  .chat-input::placeholder { color:#6a6b6c; }
  .chat-input::-webkit-scrollbar { width:6px; }
  .chat-input::-webkit-scrollbar-track { background:transparent; }
  .chat-input::-webkit-scrollbar-thumb {
    background:rgba(255,255,255,.12); border-radius:999px;
    border:1.5px solid transparent; background-clip:padding-box;
  }
  .chat-input::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.24); background-clip:padding-box; }
  .chat-send {
    width:21px; height:21px; border-radius:50%; flex:none;
    background:linear-gradient(180deg,#3fb950,#238636);
    border:1px solid rgba(46,160,67,.6); color:#fff;
    font-size:9px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(0,0,0,.4);
    transition:transform .12s, background .15s;
  }
  .chat-send:hover { background:linear-gradient(180deg,#46d360,#2ea043); }
  .chat-send:active { transform:scale(.92); }
  .chat-corner {
    position:absolute; right:0; bottom:0; width:13px; height:13px;
    cursor:nwse-resize; border-radius:0 0 9px 0;
    background:
      linear-gradient(135deg, transparent 0 52%, rgba(255,255,255,.28) 52% 60%, transparent 60% 74%, rgba(255,255,255,.28) 74% 82%, transparent 82%);
  }
  .chat-corner:hover {
    background:
      linear-gradient(135deg, transparent 0 52%, #55b3ff 52% 60%, transparent 60% 74%, #55b3ff 74% 82%, transparent 82%);
  }
  .pad-b { height:6px; flex:none; }
</style>
</head>
<body>
<div id="zoomwrap">
  <div class="bubble-space"></div>
  <div class="bubble" id="bubble"></div>

  <div class="zone-char" id="zoneChar">
    <div class="char" id="char">
      <div class="floaty">
        <svg class="character" id="charSvg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ni-Oh slime — tái hiện sát ảnh mẫu (Llor slime): dome hồng rộng đáy gần phẳng,
       chóp nhỏ lệch phải, viền đen mảnh, gloss vệt trắng lớn, bong bóng tách rời
       góc trên phải, mắt chấm nâu đen highlight kép, miệng mèo w + lưỡi thè.
       Vật thể TIẾP ĐỊA: đáy y~200 + ellipse bóng. Mọi nhóm biểu cảm display:none
       trừ eyes-open + m-omega — app bật theo [data-emo] (emotions.js). -->
  <defs>
    <linearGradient id="slimeG" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffd2da"/>
      <stop offset=".45" stop-color="#ffbbc6"/>
      <stop offset="1" stop-color="#f78e9f"/>
    </linearGradient>
    <radialGradient id="dropG" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#ffe6ec"/>
      <stop offset="1" stop-color="#fb9cad"/>
    </radialGradient>
    <linearGradient id="tongueG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8a094"/>
      <stop offset="1" stop-color="#ee7268"/>
    </linearGradient>
  </defs>

  <!-- bóng tiếp địa -->
  <ellipse class="puddle" cx="100" cy="209" rx="76" ry="8" fill="#1a1a1a" opacity=".15"/>

  <g class="slime-body">
    <!-- bong bóng tinh nghịch tách rời (đọc từ ảnh mẫu) -->
    <g class="drop">
      <circle cx="163" cy="55" r="12.5" fill="url(#dropG)" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="158.8" cy="50.5" r="3.4" fill="#fff" opacity=".95"/>
    </g>

    <!-- thân: dome rộng, đáy gần phẳng, chóp lệch phải -->
    <path d="M18 196 C10 148 20 100 54 79 C74 67 90 63 104 62 C108 54 112 47 117 42 C121 49 123 56 125 62 C158 68 190 118 182 196 Q100 208 18 196 Z"
          fill="url(#slimeG)" stroke="#1a1a1a" stroke-width="3.6" stroke-linejoin="round"/>

    <!-- gloss: vệt trắng lớn nghiêng trái-trên + 2 shine nhỏ (đúng ảnh mẫu) -->
    <ellipse class="glint" cx="64" cy="90" rx="25" ry="10.5" fill="#fff" opacity=".95" transform="rotate(-32 64 90)"/>
    <ellipse cx="32" cy="152" rx="7.5" ry="4" fill="#fff" opacity=".9" transform="rotate(-14 32 152)"/>
    <ellipse cx="166" cy="166" rx="9.5" ry="5" fill="#fff" opacity=".9" transform="rotate(14 166 166)"/>

    <!-- má hồng (ẩn — state vui/yêu bật) -->
    <g class="blush" fill="#ff7d95" opacity=".5">
      <ellipse cx="60" cy="158" rx="8" ry="4.5"/><ellipse cx="140" cy="158" rx="8" ry="4.5"/>
    </g>
    <g class="blush-strong" fill="#ff5f7f" opacity=".75">
      <ellipse cx="58" cy="158" rx="9.5" ry="5.5"/><ellipse cx="142" cy="158" rx="9.5" ry="5.5"/>
    </g>

    <!-- ═══ MẮT — hốc chuẩn (78,142)/(122,142), mọi biểu cảm cùng vị trí ═══ -->
    <g class="eyes-open">
      <g class="pupL"><ellipse cx="78" cy="142" rx="10.5" ry="13" fill="#2b0f14"/><circle cx="74" cy="136" r="3.8" fill="#fff"/><circle cx="81.5" cy="147" r="1.7" fill="#fff" opacity=".75"/></g>
      <g class="pupR"><ellipse cx="122" cy="142" rx="10.5" ry="13" fill="#2b0f14"/><circle cx="118" cy="136" r="3.8" fill="#fff"/><circle cx="125.5" cy="147" r="1.7" fill="#fff" opacity=".75"/></g>
    </g>
    <g class="eyes-happy" stroke="#2b0f14" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M68 146 Q78 133 88 146"/><path d="M112 146 Q122 133 132 146"/>
    </g>
    <g class="eyes-laugh" stroke="#2b0f14" stroke-width="3.8" stroke-linecap="round" fill="none">
      <path d="M68 147 Q78 132 88 147 M71 139 l-4 -3"/><path d="M112 147 Q122 132 132 147 M129 139 l4 -3"/>
    </g>
    <g class="eyes-closed" stroke="#2b0f14" stroke-width="3.4" stroke-linecap="round" fill="none">
      <path d="M68 143 Q78 150 88 143"/><path d="M112 143 Q122 150 132 143"/>
    </g>
    <g class="eyes-sad">
      <ellipse cx="78" cy="146" rx="9.5" ry="10.5" fill="#2b0f14"/>
      <ellipse cx="122" cy="146" rx="9.5" ry="10.5" fill="#2b0f14"/>
      <path d="M66 138 Q78 132 89 137 L89 128 L66 128 Z" fill="url(#slimeG)"/>
      <path d="M111 137 Q122 132 134 138 L134 128 L111 128 Z" fill="url(#slimeG)"/>
      <circle cx="75" cy="149" r="2.6" fill="#fff" opacity=".9"/><circle cx="119" cy="149" r="2.6" fill="#fff" opacity=".9"/>
    </g>
    <g class="brow-sad" stroke="#2b0f14" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M67 134 L88 126"/><path d="M133 134 L112 126"/>
    </g>
    <g class="eyes-cry" stroke="#2b0f14" stroke-width="3.4" stroke-linecap="round" fill="none">
      <path d="M68 140 Q78 150 88 140"/><path d="M112 140 Q122 150 132 140"/>
    </g>
    <g class="tears" fill="#8fd0f5" stroke="#4a9cc8" stroke-width="1.6">
      <path d="M70 150 Q66 164 71 170 Q77 165 74 150 Z"/>
      <path d="M130 150 Q134 164 129 170 Q123 165 126 150 Z"/>
    </g>
    <g class="eyes-wide">
      <ellipse cx="78" cy="141" rx="12" ry="14" fill="#fff" stroke="#2b0f14" stroke-width="2.6"/>
      <ellipse cx="122" cy="141" rx="12" ry="14" fill="#fff" stroke="#2b0f14" stroke-width="2.6"/>
      <circle cx="78" cy="142" r="5" fill="#2b0f14"/><circle cx="122" cy="142" r="5" fill="#2b0f14"/>
    </g>
    <g class="eyes-alert">
      <ellipse cx="78" cy="140" rx="12.5" ry="15" fill="#fff" stroke="#2b0f14" stroke-width="2.8"/>
      <ellipse cx="122" cy="140" rx="12.5" ry="15" fill="#fff" stroke="#2b0f14" stroke-width="2.8"/>
      <circle cx="78" cy="141" r="3.4" fill="#2b0f14"/><circle cx="122" cy="141" r="3.4" fill="#2b0f14"/>
    </g>
    <g class="eyes-spiral" stroke="#2b0f14" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M78 142 m-8 0 a8 8 0 1 1 4 7 a4.5 4.5 0 1 1 4 -6"/>
      <path d="M122 142 m8 0 a8 8 0 1 0 -4 7 a4.5 4.5 0 1 0 -4 -6"/>
    </g>
    <g class="eyes-uneven">
      <ellipse cx="78" cy="140" rx="11" ry="13.5" fill="#2b0f14"/><circle cx="74.5" cy="135" r="3.4" fill="#fff"/>
      <ellipse cx="122" cy="144" rx="8" ry="9.5" fill="#2b0f14"/><circle cx="119" cy="140.5" r="2.6" fill="#fff"/>
    </g>
    <g class="eyes-up">
      <g class="pupL"><ellipse cx="79" cy="136" rx="10" ry="11.5" fill="#2b0f14"/><circle cx="75.5" cy="131" r="3.4" fill="#fff"/></g>
      <g class="pupR"><ellipse cx="123" cy="136" rx="10" ry="11.5" fill="#2b0f14"/><circle cx="119.5" cy="131" r="3.4" fill="#fff"/></g>
      <path d="M66 148 Q78 152 89 148" stroke="#2b0f14" stroke-width="2" fill="none" opacity=".55"/>
    </g>
    <g class="eyes-cool">

<script src="emotions.js"></script>
  <script>
  let cfg = {};
  const wrap = document.getElementById('zoomwrap');
  const zoneChar = document.getElementById('zoneChar');
  const char = document.getElementById('char');
  const bubble = document.getElementById('bubble');
  const bar = document.getElementById('zoneBar');
  const chatPanel = document.getElementById('chatPanel');
  const chatBox = document.getElementById('chatBox');
  const chatInput = document.getElementById('chatInput');
  const chatCorner = document.getElementById('chatCorner');
  const funcPanel = document.getElementById('funcPanel');
  const scaleInput = document.getElementById('scaleInput');
  let bubbleTimer = null;

  // ═══ HÌNH HỌC — cửa sổ CHỪ SẼN chỗ chat: kéo khung chat KHÔNG resize cửa sổ ═══
  const NAT_W = 240;          // bề rộng thiết kế của wrapper (chưa scale)
  const CHAT_MAX_W = 300;     // khung chat tối đa → cửa sổ luôn rộng đủ
  const CHAT_RESERVE = 158;   // chiều cao chừa sẵn dưới hàng nút cho pop-up chat
  let cscale = 1, shiftX = 0, shiftY = 0;

  function bubbleBottom() {   // đáy bubble = đỉnh đầu nhân vật/avatar + 18px
    return 18 + bar.offsetHeight + 8 + (charHidden ? 54 : 144) + 6;
  }
  function fitWindow(keepTop) {
    wrap.style.transform = `scale(${cscale})`;
    const sH = Math.ceil(wrap.getBoundingClientRect().height);
    const W = Math.max(NAT_W * cscale, CHAT_MAX_W + 16);
    wrap.style.left = Math.round((W - NAT_W * cscale) / 2) + 'px';
    chatPanel.style.top = sH + 'px';
    bubble.style.bottom = bubbleBottom() + 'px';
    window.niOhAPI.overlayMetrics({
      width: Math.round(W), height: sH + CHAT_RESERVE + 2,
      dx: Math.round(shiftX), dy: Math.round(shiftY), keepTop: !!keepTop
    });
    shiftX = 0; shiftY = 0;
  }
  window.addEventListener('resize', () => fitWindow());

  // ═══ HIT-TEST điểm ảnh có hình — trong suốt xuyên chuột ═══
  let clickable = true;
  let alphaMask = null, maskW = 200, maskH = 240;
  function maskFromSource(src, w, h) {
    const img = new Image();
    img.onload = () => {
      try {
        maskW = w || img.naturalWidth || 200; maskH = h || img.naturalHeight || 240;
        const c = document.createElement('canvas'); c.width = maskW; c.height = maskH;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, maskW, maskH);
        const px = ctx.getImageData(0, 0, maskW, maskH).data;
        const m = new Uint8Array(maskW * maskH);
        for (let i = 0; i < m.length; i++) m[i] = px[i * 4 + 3];
        alphaMask = m;
      } catch (e) { alphaMask = null; }
    };
    img.src = src;
  }
  function buildDefaultMask() {
    const imgEl = document.getElementById('charImg');
    if (imgEl && imgEl.style.display !== 'none' && imgEl.src) { maskFromSource(imgEl.src); return; }
    const svg = document.getElementById('charSvgDisk') || document.getElementById('charSvg');
    if (!svg) return;
    const xml = new XMLSerializer().serializeToString(svg);
    maskFromSource('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml), 200, 240);
  }
  buildDefaultMask();

  // ── default = file đĩa assets/characters/default.svg (Sếp thay file = đổi nhân vật,
  //    app tự suy các trạng thái từ SVG + CSS biểu cảm). Inline SVG chỉ là fallback. ──
  async function loadDefaultFromDisk() {
    try {
      const holder = document.querySelector('.floaty');
      const keepImg = document.getElementById('charImg');
      // 1) ưu tiên default.svg → app tự suy biểu cảm
      let r = await window.niOhAPI.readAsset('characters/default.svg');
      if (r && r.success && /<svg/i.test(r.text || '')) {
        let txt = r.text.replace(/<style>[\s\S]*?<\/style>/i, '');
        txt = txt.replace('<svg', '<svg class="character" id="charSvgDisk"', 1);
        holder.innerHTML = txt;
        if (keepImg) holder.appendChild(keepImg);
        defaultFromDisk = true;
      } else {
        // 2) default.gif / default.png → ảnh động, giữ nguyên frame gốc
        for (const ext of ['gif', 'apng', 'png', 'webp']) {
          r = await window.niOhAPI.readAsset('characters/default.' + ext);
          if (r && r.success && r.base64) {
            const svgEl = document.getElementById('charSvg');
            if (svgEl) svgEl.style.display = 'none';
            keepImg.src = 'data:image/' + (ext === 'apng' ? 'png' : ext) + ';base64,' + r.base64;
            keepImg.style.display = 'block';
            defaultFromDisk = true;
            break;
          }
        }
      }
      if (defaultFromDisk) { buildDefaultMask(); fitWindow(); }
    } catch (e) { /* giữ inline fallback */ }
  }
  let defaultFromDisk = false;
  loadDefaultFromDisk();
  const miniAvatar = document.getElementById('miniAvatar');
  function hitCharacter(x, y) {
    if (charHidden) {                       // ẩn → vùng kéo là avatar tròn
      const m = miniAvatar.getBoundingClientRect();
      if (!m.width) return false;
      const dx = (x - (m.left + m.width / 2)) / (m.width / 2);
      const dy = (y - (m.top + m.height / 2)) / (m.height / 2);
      return dx * dx + dy * dy <= 1.15;
    }
    const r = char.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    if (x < r.left || x > r.right || y < r.top || y > r.bottom) return false;
    if (!alphaMask) return true;
    const lx = Math.min(maskW - 1, Math.floor((x - r.left) / r.width * maskW));
    const ly = Math.min(maskH - 1, Math.floor((y - r.top) / r.height * maskH));
    return alphaMask[ly * maskW + lx] > 12;
  }
  function overInteractive(e) {
    const t = e.target;
    if (t.closest('.zone-bar') || t.closest('.zone-chat') || t.closest('.zone-func') || t.closest('.bubble')) return true;
    return hitCharacter(e.clientX, e.clientY);
  }
  function setClickable(on) {
    if (on === clickable) return;
    clickable = on;
    window.niOhAPI.setClickable(on);
    document.body.classList.toggle('over-char', on);
  }
  document.addEventListener('mousemove', (e) => {
    if (drag) return;
    setClickable(overInteractive(e));
  });

  // ═══ KÉO THẢ: chỉ từ nhân vật / avatar đại diện ═══
  let drag = null, dragWasMoved = false;
  function canDragFrom(e) {
    if (e.button !== 0) return false;
    if (e.target.closest('textarea, input, .btn, .chat-send, .chat-corner, .zone-bar, .zone-chat, .zone-func')) return false;
    return hitCharacter(e.clientX, e.clientY);
  }
  document.addEventListener('mousedown', async (e) => {
    if (!canDragFrom(e)) return;
    drag = { moved: false, ready: false };
    document.body.classList.add('dragging');
    e.preventDefault();
    const off = await window.niOhAPI.overlayDragStart();
    if (drag) { drag.ready = true; drag.off = off; }
  });
  document.addEventListener('mousemove', () => {
    if (!drag || !drag.ready) return;
    drag.moved = true;
    window.niOhAPI.overlayDragMove();
  });
  document.addEventListener('mouseup', () => {
    if (drag) {
      if (drag.moved) window.niOhAPI.overlayDragEnd();
      dragWasMoved = drag.moved;
      setTimeout(() => { dragWasMoved = false; }, 50);
      drag = null; document.body.classList.remove('dragging');
    }
  });

  // Chạm hình (không kéo) → boing
  document.addEventListener('click', (e) => {
    if (dragWasMoved) return;
    if (e.target.closest('.zone-bar') || e.target.closest('.zone-chat') || e.target.closest('.zone-func') || e.target.closest('.bubble')) return;
    if (!hitCharacter(e.clientX, e.clientY)) return;
    zoneChar.classList.remove('poke'); void zoneChar.offsetWidth; zoneChar.classList.add('poke');
    setTimeout(() => zoneChar.classList.remove('poke'), 700);
  });

  // ═══ SCALE: lăn chuột (neo con trỏ) + ô % trong popup ═══
  function setScale(v, anchorX, anchorY) {
    const s1 = Math.min(1.8, Math.max(0.6, v));
    if (Math.abs(s1 - cscale) < 1e-4) { scaleInput.value = Math.round(cscale * 100); return; }
    const k = s1 / cscale;
    if (anchorX != null) { shiftX += anchorX * (1 - k); shiftY += anchorY * (1 - k); }
    else { shiftX += innerWidth / 2 * (1 - k); shiftY += innerHeight / 2 * (1 - k); }
    cscale = s1;
    scaleInput.value = Math.round(cscale * 100);
    fitWindow();
    window.niOhAPI.saveConfig({ characterScale: Math.round(cscale * 100) / 100 });
  }
  document.addEventListener('wheel', (e) => {
    if (e.target.closest('.zone-chat') || e.target.closest('.zone-func') || e.target.closest('.bubble')) return;
    if (e.target.closest('input')) return;
    e.preventDefault();
    setScale(cscale + (e.deltaY < 0 ? 0.06 : -0.06), e.clientX, e.clientY);
  }, { passive: false });
  scaleInput.addEventListener('change', () => {
    let v = parseFloat(scaleInput.value);
    if (!isFinite(v)) v = 100;
    setScale(v / 100);
  });
  scaleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') scaleInput.blur(); e.stopPropagation(); });

  // ═══ Popup nút chức năng ═══
  function openFunc(v) {
    const open = (v === undefined) ? !funcPanel.classList.contains('open') : !!v;
    funcPanel.classList.toggle('open', open);
    document.getElementById('btnFunc').classList.toggle('active', open);
    fitWindow(true);   // giữ đỉnh — hàng nút không xê dịch
  }
  document.getElementById('btnFunc').addEventListener('click', (e) => { e.stopPropagation(); openFunc(); });

  // ═══ Ẩn/hiện nhân vật: hàng nút CỐ ĐỊNH, nhân vật co về avatar ═══
  let charHidden = false;
  function setCharHidden(v) {
    charHidden = !!v;
    document.body.classList.toggle('no-char', charHidden);
    document.getElementById('btnHideChar').classList.toggle('active', charHidden);
    fitWindow(true);
  }
  document.getElementById('btnHideChar').addEventListener('click', () => {
    setCharHidden(!charHidden);
    window.niOhAPI.saveConfig({ overlayCharHidden: charHidden });
  });

  // ═══ MÁY BIỂU CẢM 25 TRẠNG THÁI (bảng NIOH_EMOTIONS — nguồn duy nhất) ═══
  const EMO = (window.NIOH_EMOTIONS || []).reduce((a, e) => (a[e.id] = e, a), {});
  (function buildEmoCSS() {   // sinh rules bật/tắt nhóm SVG từ bảng — thêm state là tự có
    const DUR = { march:'.9s', shiver:'.18s', tremble:'.18s', nodding:'.7s', shaking:'.7s', doze:'4s', rock:'.5s', tilt:'2.4s', lean:'1.8s', sway:'1.4s', pop:'.8s', boing:'1.1s', hop:'1.3s', droop:'3s' };
    let css = '';
    for (const id in EMO) {
      const e = EMO[id];
      const on = [...(e.eyes||[]), ...(e.mouth||[]), ...(e.extras||[])];
      if (e.anim) css += `#char[data-emo="${id}"] .slime-body { animation:${e.anim} ${DUR[id]||'2.2s'} ease-in-out infinite; }\n`;
      if (on.length) css += `#char[data-emo="${id}"] .${on.join(', #char[data-emo="'+id+'"] .')} { display:block; }\n`;
      const hide = [];
      if (!(e.eyes||[]).includes('eyes-open')) hide.push('eyes-open');
      if (!(e.mouth||[]).includes('m-omega')) hide.push('m-omega');
      if (hide.length) css += `#char[data-emo="${id}"] .${hide.join(', #char[data-emo="'+id+'"] .')} { display:none !important; }\n`;
    }
    const st = document.createElement('style'); st.id = 'emo-style'; st.textContent = css;
    document.head.appendChild(st);
  })();
  const _LEGACY = { talking:'talk', thinking:'think', sleepy:'sleep', error:'sad', fidget:'march', idle_fidget:'march', look_cursor:'look' };
  let emoReturnTimer = null;
  function setAnim(state, ms) {
    state = _LEGACY[state] || state;
    if (!state) state = 'idle';
    if (!EMO[state]) return;
    clearTimeout(emoReturnTimer);
    char.dataset.emo = state;
    if (state !== 'talk') { stopLipsync(); char.classList.remove('lipsync'); }
    const img = document.getElementById('charImg');
    const src = poseSrc(state);
    if (img.style.display !== 'none' && src) img.src = src;
    if (ms) emoReturnTimer = setTimeout(() => setAnim(currentBaseEmo(), 0), ms);
  }
  function currentBaseEmo() {
    // nền khi hết biểu cảm tạm: ngủ→sleep, nói dở→talk, rảnh chạy bộ nhẹ→march xen idle
    if (audioEl && !audioEl.paused) return 'talk';
    return 'idle';
  }
  window.niOhAPI.onTalkState((on) => setAnim(on ? 'talk' : null));
  window.niOhAPI.onThinking((sec) => setAnim('think', Math.min(60000, (sec||8) * 1000)));
  window.niOhAPI.onEmotion && window.niOhAPI.onEmotion((mood, sec) => setAnim(mood, sec ? sec * 1000 : 6000));
  let idleSleepTimer = setTimeout(() => setAnim('sleep', 0), 10 * 60 * 1000);
  function resetSleep() { clearTimeout(idleSleepTimer); if (char.dataset.emo === 'sleep') setAnim(null); idleSleepTimer = setTimeout(() => setAnim('sleep', 0), 10 * 60 * 1000); }
  ['mousedown','wheel','keydown','mousemove'].forEach(ev => document.addEventListener(ev, resetSleep));

  // ═══ LIẾC MẮT THEO CHUỘT (SVG default: đồng tử chạy trong hốc mắt) ═══
  let _pupT = 0;
  document.addEventListener('mousemove', (e) => {
    const now = Date.now(); if (now - _pupT < 80) return; _pupT = now;
    const emo = char.dataset.emo;
    if (emo && emo !== 'idle' && emo !== 'look' && emo !== 'curious') return;
    const svg = document.querySelector('#charSvgDisk, #charSvg');
    if (!svg || svg.style.display === 'none') return;
    const r = svg.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2)) / (window.innerWidth/2 || 1);
    const dy = (e.clientY - (r.top + r.height/2)) / (window.innerHeight/2 || 1);
    const tx = Math.max(-4.2, Math.min(4.2, dx * 4.2)), ty = Math.max(-3, Math.min(3.4, dy * 3.4));
    svg.querySelectorAll('.pupL,.pupR').forEach(g => { g.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)`; });
  });

  function showBubble(text) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), Math.max(4000, text.length * 80));
  }
  window.niOhAPI.onSay((text) => showBubble(text));

  let audioEl = null, audioUrl = '';
  // ── Mouth-sync học từ video BMO: miệng không chạy animation tuần hoàn giả mà
  //    bám BIÊN ĐỘ THẬT của giọng Ngọc Linh (Web Audio AnalyserNode, RMS mỗi frame) ──
  let ac = null, analyser = null, mSrc = null, timeBuf = null, lsRaf = 0;
  function ensureLipsync() {
    if (ac || !audioEl) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      mSrc = ac.createMediaElementSource(audioEl);
      analyser = ac.createAnalyser(); analyser.fftSize = 256;
      mSrc.connect(analyser); analyser.connect(ac.destination);
      timeBuf = new Uint8Array(analyser.fftSize);
    } catch (e) { ac = null; }
  }
  function startLipsync() {
    const mouth = document.querySelector('#char .m-o');
    if (!ac || !mouth) return;
    char.classList.add('lipsync');
    cancelAnimationFrame(lsRaf);
    let live = 0, deadFrames = 0;
    const step = () => {
      analyser.getByteTimeDomainData(timeBuf);
      let sum = 0;
      for (let i = 0; i < timeBuf.length; i++) { const v = (timeBuf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / timeBuf.length);
      if (rms > 0.005) { live++; deadFrames = 0; } else if (live === 0) { deadFrames++; }
      // file:// có thể bị Web Audio chặn đọc → im lặng giả → trả về animation CSS
      if (!live && deadFrames > 90) { stopLipsync(); return; }
      const k = Math.min(1.35, 0.22 + rms * 7.5);          // im lặng → miệng ngậm, to → mở max
      mouth.style.transform = 'scaleY(' + k.toFixed(3) + ')';
      lsRaf = requestAnimationFrame(step);
    };
    lsRaf = requestAnimationFrame(step);
  }
  function stopLipsync() {
    cancelAnimationFrame(lsRaf); lsRaf = 0;
    char.classList.remove('lipsync');
    const mouth = document.querySelector('#char .m-o');
    if (mouth) mouth.style.transform = '';
  }
  function playInOverlay(url, rate, caption) {
    if (caption) _pendingBubble = caption;   // chữ chờ đúng nhịp tiếng cất (đồng bộ giọng–hình)
    if (!audioEl) { audioEl = new Audio(); audioEl.preload = 'auto';
      audioEl.addEventListener('play', () => { setAnim('talking'); ensureLipsync(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); startLipsync();
        if (_pendingBubble) { showBubble(_pendingBubble); _pendingBubble = ''; } });
      audioEl.addEventListener('ended', () => { stopLipsync(); if (pendingFace) { const pf = pendingFace; pendingFace = null; setAnim(pf.f, pf.d); } else setAnim(null); });
      audioEl.addEventListener('error', () => { stopLipsync(); setAnim(null); if (_pendingBubble) { showBubble(_pendingBubble); _pendingBubble = ''; } });
    }
    if (audioUrl === url && !audioEl.paused) { try { audioEl.pause(); } catch(e){} }
    audioUrl = url;
    audioEl.src = url;
    try { audioEl.playbackRate = Math.min(1.6, Math.max(0.5, rate || 1)); } catch(e){}
    audioEl.play().catch(() => {});
  }
  window.niOhAPI.onPlayFile((msg) => { if (msg && msg.url) playInOverlay(msg.url, msg.rate, msg.caption); });

  // ── COMBAT REFLEX: tiếng đã đúc sẵn trong Voice_Packs → fetch 1 lần giữ
  //    ArrayBuffer trên RAM (≈ dict PCM của combat_loop), phát <5ms, KHÔNG
  //    qua mạng/TTS sống. Chỉ dẫn mới CẮT chỉ dẫn cũ — tình huống combat
  //    đổi liên tục thì miệng phải đổi theo. ──
  const _pcm = new Map();               // url -> ArrayBuffer (RAM)
  let _reflexEl = null;
  function ensureReflexEl() {
    if (_reflexEl) return _reflexEl;
    _reflexEl = new Audio(); _reflexEl.preload = 'auto';
    _reflexEl.addEventListener('play', () => {
      setAnim('talking'); ensureLipsync(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); startLipsync();
      if (_pendingBubble) { showBubble(_pendingBubble); _pendingBubble = ''; }   // chữ nở đúng khoảnh khắc tiếng cất
    });
    _reflexEl.addEventListener('ended', () => { stopLipsync(); if (pendingFace) { const pf = pendingFace; pendingFace = null; setAnim(pf.f, pf.d); } else setAnim(null); });
    _reflexEl.addEventListener('error', () => { stopLipsync(); setAnim(null); });
    window.__reflexEl = _reflexEl;
    return _reflexEl;
  }
  function b64ToBlobUrl(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], { type: 'audio/wav' }));
  }
  let _pendingBubble = '';
  function playReflex(url, text, rate) {
    // KHÔNG hiện chữ trước khi loa cất tiếng — giọng và hộp thoại phải NỞ CÙNG LÚC
    _pendingBubble = text || '';
    const el = ensureReflexEl();
    // AtomicSwap: chỉ dẫn mới CẮT chỉ dẫn cũ đang phát dở (combat đổi liên tục)
    if (audioEl && !audioEl.paused) { try { audioEl.pause(); } catch (e) {} }
    if (!el.paused) { try { el.pause(); } catch (e) {} }
    const fire = (src) => {
      el.src = src;
      try { el.playbackRate = Math.min(1.6, Math.max(0.5, rate || 1)); } catch (e) {}
      el.play().catch(() => {});
    };
    const warm = _pcm.get(url);
    if (warm) { fire(warm); return; }
    const fp = decodeURIComponent(url.replace(/^file:\/\/\//, ''));
    window.niOhAPI.readWav(fp).then(r => {
      if (r && r.success) { const u = b64ToBlobUrl(r.b64); _pcm.set(url, u); fire(u); }
      else fire(url);   // đường cùng mới thử file:// thẳng
    }).catch(() => fire(url));
  }
  window.niOhAPI.onReflexSay((m) => { if (m && m.url) playReflex(m.url, m.text, m.rate); });
  window.__reflex = (u, tx, r) => playReflex(u, tx, r);   // dev/CDP: đo latency
  window.__pcmSize = () => _pcm.size;   // dev/CDP
  window.niOhAPI.onPackChanged && window.niOhAPI.onPackChanged(() => { _pcm.clear(); });   // hot-reload: wav mới đúc → bỏ cache cũ


  // ── Máy trạng thái biểu cảm (BMO: state đổi → mặt đổi + canned clip đồng giọng ngẫu nhiên) ──
  let cannedEl = null, lastCanned = 0;
  function playCanned(url) {
    const now = Date.now();
    if (now - lastCanned < 6000) return;                 // chống spam
    if (audioEl && !audioEl.paused) return;              // TTS chính đang nói → nhường
    try {
      if (!cannedEl) { cannedEl = new Audio(); cannedEl.preload = 'auto'; }
      cannedEl.src = url; cannedEl.volume = 0.9;
      cannedEl.play().catch(() => {});
      lastCanned = now;
    } catch (e) {}
  }
  let pendingFace = null;
  window.niOhAPI.onUiState((m) => {
    if (!m || m.state === 'speaking') return;            // speaking do chính audio play event lo
    const dur = m.ms || (m.state === 'wake' ? 2200 : m.state === 'error' ? 4000 : 2600);
    if (m.face) {
      if (audioEl && !audioEl.paused && m.face !== 'talk') pendingFace = { f: m.face, d: dur };  // đừng cướp mặt giữa câu nói
      else setAnim(m.face, m.face === 'idle' ? 0 : dur);
    }
    if (m.clip) playCanned(m.clip);
  });

  // ═══ Config ═══
  function poseSrc(pose) {
    const P = cfg.characterPoses;
    if (!P || cfg.character === 'default') return null;
    const key = pose || 'idle';
    return P[key] ? (window.location.href.replace(/overlay\.html.*$/, '') + P[key]) : (P.idle ? (window.location.href.replace(/overlay\.html.*$/, '') + P.idle) : (cfg.characterImage || null));
  }
  let _lastCharName = null;
  function apply(cfg2) {
    cfg = cfg2 || cfg;
    const changed = _lastCharName !== null && cfg.character !== _lastCharName;
    _lastCharName = cfg.character;
    const img = document.getElementById('charImg');
    const svg = document.getElementById('charSvgDisk') || document.getElementById('charSvg');
    const idleSrc = poseSrc('idle') || (cfg.characterImage && cfg.character !== 'default' ? cfg.characterImage : null);
    if (idleSrc) { img.src = idleSrc; img.style.display = 'block'; svg.style.display = 'none'; maskFromSource(idleSrc); }
    else { img.style.display = 'none'; svg.style.display = 'block'; buildDefaultMask(); }
    // default.svg từ đĩa có animation sẵn → nếu đang là default, mask dựng lại sau khi load xong
    if (!idleSrc && defaultFromDisk) buildDefaultMask();
    if (changed) setAnim('transform', 950);   // hoạt ảnh biến đổi mỗi lần đổi nhân vật
    const s = Math.min(1.8, Math.max(0.6, cfg.characterScale || 1));
    if (Math.abs(s - cscale) > 0.001) { cscale = s; scaleInput.value = Math.round(s * 100); fitWindow(true); }
    setCharHidden(!!cfg.overlayCharHidden);
    applyChatSize();
    const eyeOn = !!cfg.realtimeScanEnabled;
    document.getElementById('btnEye').classList.toggle('active', eyeOn);
    document.getElementById('btnMic').classList.toggle('active', (cfg.micMode || 'off') !== 'off');
    document.getElementById('btnMute').textContent = cfg.ttsEnabled ? '🔊' : '🔇';
    document.getElementById('stateDot').classList.toggle('on', eyeOn);
    document.getElementById('stateDot').title = eyeOn ? 'YOLO đang bật' : 'YOLO đang tắt';
    if (cfg.lastAnswer && cfg.lastAnswer !== apply._last) { apply._last = cfg.lastAnswer; showBubble(cfg.lastAnswer); }
  }
  window.niOhAPI.onInitConfig(apply);
  window.niOhAPI.onConfigUpdate(apply);
  fitWindow(true);

  // ═══ Nút chức năng ═══
  document.getElementById('btnEye').addEventListener('click', async () => {
    const r = await window.niOhAPI.toggleRealtimeScan();
    const on = !!(r && r.running);
    showBubble(on ? 'Đang quan sát PC, Sếp.' : 'Đã tắt quan sát PC.');
  });
  document.getElementById('btnMute').addEventListener('click', async () => {
    await window.niOhAPI.saveConfig({ ttsEnabled: !cfg.ttsEnabled });
  });
  document.getElementById('btnMic').addEventListener('click', async () => {
    const r = await window.niOhAPI.micToggle();
    const on = r.success && r.mode !== 'off';
    document.getElementById('btnMic').classList.toggle('active', on);
    showBubble(on ? 'Ni-Oh đang lắng nghe micro, Sếp cứ nói.' : 'Đã tắt micro.');
  });

  // ═══ Khung chat — mở/đóng KHÔNG resize cửa sổ (chỗ đã chừa sẵn) ═══
  function openChat(v) {
    const open = (v === undefined) ? !chatPanel.classList.contains('open') : !!v;
    chatPanel.classList.toggle('open', open);
    document.getElementById('btnChat').classList.toggle('active', open);
    if (open) { applyChatSize(); chatInput.focus(); autoResize(); }
  }
  document.getElementById('btnChat').addEventListener('click', (e) => { e.stopPropagation(); openChat(); });
  document.addEventListener('pointerdown', (e) => {
    if (funcPanel.classList.contains('open') && !funcPanel.contains(e.target) && !e.target.closest('#btnFunc')) openFunc(false);
    if (chatPanel.classList.contains('open') && !chatPanel.contains(e.target) && !e.target.closest('#btnChat')) openChat(false);
  });

  function applyChatSize() {
    const w = Math.min(CHAT_MAX_W, Math.max(140, cfg.chatBoxW || 224));
    const h = Math.min(130, Math.max(21, cfg.chatBoxH || 21));
    chatBox.style.width = w + 'px';
    chatInput.style.height = h + 'px';
    if (cfg.chatBoxH) chatInput.dataset.userSized = '1';
  }
  function autoResize() {
    if (!chatInput.dataset.userSized) {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.max(21, Math.min(130, chatInput.scrollHeight)) + 'px';
    }
  }
  chatInput.addEventListener('input', autoResize);

  // grip GÓC: giãn 2 chiều — thuần CSS, không IPC → mượt tuyệt đối
  chatCorner.addEventListener('mousedown', (e) => {
    e.preventDefault(); e.stopPropagation();
    const sx = e.clientX, sy = e.clientY;
    const w0 = chatBox.offsetWidth, h0 = chatInput.offsetHeight;
    function move(ev) {
      chatBox.style.width = Math.min(CHAT_MAX_W, Math.max(140, w0 + (ev.clientX - sx))) + 'px';
      chatInput.dataset.userSized = '1';
      chatInput.style.height = Math.min(130, Math.max(21, h0 + (ev.clientY - sy))) + 'px';
    }
    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      window.niOhAPI.saveConfig({ chatBoxW: chatBox.offsetWidth, chatBoxH: chatInput.offsetHeight });
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    if (e.key === 'Escape') { openChat(false); openFunc(false); }
    e.stopPropagation();
  });
  let asking = false;
  async function sendChat() {
    const q = chatInput.value.trim();
    if (!q || asking) return;
    asking = true;
    chatInput.value = '';
    if (!cfg.chatBoxH) { chatInput.dataset.userSized = ''; chatInput.style.height = '21px'; autoResize(); }
    setAnim('think', 60000);
    try {
      const r = await window.niOhAPI.askQuestion(q);
      setAnim(null);
      showBubble(r.success ? r.answer : 'Lỗi: ' + (r.error || '?'));
    } finally { asking = false; }
  }
  document.getElementById('chatSend').addEventListener('click', sendChat);
</script>
