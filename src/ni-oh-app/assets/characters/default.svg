<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ni-Oh slime chuẩn RPG: thân vòm rộng, ĐÁY PHẲNG NẰM MẶT ĐẤT (không lơ lửng),
       có bóng tiếp xúc + bóng tạt. 7 biểu cảm cùng khup mặt. -->
  <defs>
    <radialGradient id="slimeG" cx="34%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#e6f2ff"/>
      <stop offset="42%" stop-color="#a8c9f2"/>
      <stop offset="100%" stop-color="#6890da"/>
    </radialGradient>
    <radialGradient id="coreG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cdefff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#5aa7e8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#5aa7e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bóng đổ dưới đất (xa: loang, gan: dam) -->
  <ellipse class="puddle" cx="100" cy="212" rx="62" ry="10" fill="#9ec1ee"/>
  <ellipse cx="100" cy="211" rx="34" ry="4.5" fill="#5b7fb8" opacity=".38"/>

  <g class="slime-body">
    <!-- THAN VOM: dau 200 → 96, day phang tai y=200, gợn nhe đỉnh -->
    <path d="M42 200 C36 152 58 102 92 98 C96 89 104 89 108 98 C142 102 164 152 158 200 Q100 208 42 200 Z"
          fill="url(#slimeG)" stroke="#b7d2f2" stroke-width="2" opacity=".95"/>
    <!-- day dang vi trong luong + lop trong suot -->
    <path d="M48 190 q52 14 104 0 q-6 9 -52 9 q-46 0 -52 -9 Z" fill="#5b8bd6" opacity=".22"/>
    <path d="M60 176 q40 10 80 0 q-36 8 -80 0 Z" fill="#ffffff" opacity=".1"/>
    <!-- net gay sang tren mai -->
    <path d="M58 128 q22 -12 34 2 q-20 10 -34 -2 Z" fill="#ffffff" opacity=".16"/>
    <!-- luong the: loi trong tâm -->
    <g class="core">
      <circle cx="100" cy="150" r="26" fill="url(#coreG)"/>
      <path d="M100 136 l10 14 l-10 14 l-10 -14 Z" fill="#cfeaff" stroke="#7db8ea" stroke-width="1.4" class="glint"/>
    </g>
    <!-- dau nhu moi trong suot -->
    <ellipse class="glint" cx="66" cy="118" rx="12" ry="18" fill="#ffffff" opacity=".62" transform="rotate(-22 66 118)"/>
    <circle cx="140" cy="150" r="3.4" fill="#ffffff" opacity=".35"/>
    <g class="bub" fill="none" stroke="#bfe4ff" stroke-width="1.6">
      <circle cx="158" cy="118" r="4"/><circle cx="166" cy="104" r="2.6"/><circle cx="152" cy="96" r="1.8"/>
    </g>
    <g class="zzz" fill="#bfe4ff" font-family="Segoe UI" font-weight="700">
      <text x="150" y="112" font-size="16">z</text>
      <text x="164" y="98" font-size="12">z</text>
    </g>
  </g>

  <!-- MAT — khup tai x 70..130, mieng 90..110 (moi mau cung 1 vi tri) -->
  <g class="face">
    <g class="eyes-normal">
      <ellipse cx="80" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/>
      <ellipse cx="120" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/>
      <circle cx="78" cy="142" r="2.1" fill="#ffffff" opacity=".95"/>
      <circle cx="118" cy="142" r="2.1" fill="#ffffff" opacity=".95"/>
    </g>
    <g class="eyes-line" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M73 146 q7 5 14 0"/><path d="M113 146 q7 5 14 0"/>
    </g>
    <g class="eyes-happy" stroke="#2c4f7c" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M73 148 q7 -9 14 0"/><path d="M113 148 q7 -9 14 0"/>
    </g>
    <g class="eyes-alert">
      <circle cx="80" cy="144" r="9.5" fill="#ffffff" stroke="#2c4f7c" stroke-width="2"/>
      <circle cx="80" cy="144" r="3.6" fill="#2c4f7c"/>
      <circle cx="120" cy="144" r="9.5" fill="#ffffff" stroke="#2c4f7c" stroke-width="2"/>
      <circle cx="120" cy="144" r="3.6" fill="#2c4f7c"/>
    </g>
    <path class="m-smile" d="M90 164 Q100 172 110 164" fill="none" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse class="m-o" cx="100" cy="168" rx="5" ry="6" fill="#2c4f7c"/>
    <path class="m-flat" d="M92 168 h16" stroke="#2c4f7c" stroke-width="2.4" stroke-linecap="round"/>
    <path class="m-grin" d="M88 162 Q100 178 112 162 Q100 170 88 162 Z" fill="#2c4f7c"/>
    <ellipse class="m-big" cx="100" cy="170" rx="9" ry="13" fill="#2c4f7c"/>
    <circle cx="66" cy="158" r="4.5" fill="#ff8fb8" opacity=".3"/>
    <circle cx="134" cy="158" r="4.5" fill="#ff8fb8" opacity=".3"/>
  </g>
  <style>
  /* VAT THE NAM DAT: khong bay. Nhip "tho" bung thanh ep doc — dinh dong, day ngam. */
  .slime-body{transform-box:fill-box;transform-origin:center bottom;animation:sq 3.6s ease-in-out infinite}
  @keyframes sq{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  .eyes-normal{transform-box:fill-box;transform-origin:center;animation:bl 4.5s ease-in-out infinite}
  @keyframes bl{0%,41%,45%,100%{transform:scaleY(1)}43%{transform:scaleY(.08)}}
  .glint{animation:gl 2.8s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.6}50%{opacity:1}}
  .puddle{transform-box:fill-box;transform-origin:center;animation:pd 3.6s ease-in-out infinite}
  @keyframes pd{0%,100%{transform:scaleX(1);opacity:.4}50%{transform:scaleX(1.05);opacity:.48}}
  .face g,.face .m-o,.face .m-flat,.face .m-grin,.face .m-big,.slime-body .zzz,.slime-body .bub,.slime-body .core{display:none}
  .face .eyes-normal,.face .m-smile{display:block}
  </style>
</svg>
