<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ni-Oh slime chuẩn RPG: thân vòm rộng, ĐÁY PHẲNG NẰM MẶT ĐẤT (không lơ lửng),
       có bóng tiếp xúc + bóng tạt. Bộ biểu cảm đầy đủ cùng khup mặt (x 70..130,
       miệng 88..112 @ y 160..180). Mặc định hiện: eyes-open + m-omega; mọi nhóm
       khác app bật/ẩn theo [data-emo] (emotions.js). -->
  <defs>
    <radialGradient id="slimeG" cx="34%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#e6f2ff"/>
      <stop offset="42%" stop-color="#a8c9f2"/>
      <stop offset="100%" stop-color="#6890da"/>
    </radialGradient>
    <radialGradient id="coreG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cdefff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#5aa7e8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#5aa7e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bóng đổ dưới đất (xa: loang, gần: đậm) -->
  <ellipse class="puddle" cx="100" cy="212" rx="62" ry="10" fill="#9ec1ee" opacity=".4"/>
  <ellipse cx="100" cy="211" rx="34" ry="4.5" fill="#5b7fb8" opacity=".38"/>

  <g class="slime-body">
    <!-- THAN VOM: dau 200 → 96, day phang tai y=200, gợn nhẹ đỉnh -->
    <path d="M42 200 C36 152 58 102 92 98 C96 89 104 89 108 98 C142 102 164 152 158 200 Q100 208 42 200 Z"
          fill="url(#slimeG)" stroke="#b7d2f2" stroke-width="2" opacity=".95"/>
    <!-- đáy dạng vì trong suốt + lớp trong suốt -->
    <path d="M48 190 q52 14 104 0 q-6 9 -52 9 q-46 0 -52 -9 Z" fill="#5b8bd6" opacity=".22"/>
    <path d="M60 176 q40 10 80 0 q-36 8 -80 0 Z" fill="#ffffff" opacity=".1"/>
    <!-- nét gãy sáng trên mái -->
    <path d="M58 128 q22 -12 34 2 q-20 10 -34 -2 Z" fill="#ffffff" opacity=".16"/>
    <!-- lưỡng thể: lõi trong tâm -->
    <g class="core">
      <circle cx="100" cy="150" r="26" fill="url(#coreG)"/>
      <path d="M100 136 l10 14 l-10 14 l-10 -14 Z" fill="#cfeaff" stroke="#7db8ea" stroke-width="1.4" class="glint"/>
    </g>
    <!-- đầu như mới trong suốt -->
    <ellipse class="glint" cx="66" cy="118" rx="12" ry="18" fill="#ffffff" opacity=".62" transform="rotate(-22 66 118)"/>
    <circle cx="140" cy="150" r="3.4" fill="#ffffff" opacity=".35"/>
    <g class="bub" fill="none" stroke="#bfe4ff" stroke-width="1.6">
      <circle cx="158" cy="118" r="4"/><circle cx="166" cy="104" r="2.6"/><circle cx="152" cy="96" r="1.8"/>
    </g>
    <g class="zzz" fill="#bfe4ff" font-family="Segoe UI" font-weight="700">
      <text x="150" y="112" font-size="16">z</text>
      <text x="164" y="98" font-size="12">z</text>
    </g>

    <!-- ═══ MẮT — khup tại x 70..130, y 140..152 ═══ -->
    <g class="eyes-open">
      <g class="pupL"><ellipse cx="80" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/><circle cx="78" cy="142" r="2.1" fill="#ffffff" opacity=".95"/></g>
      <g class="pupR"><ellipse cx="120" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/><circle cx="118" cy="142" r="2.1" fill="#ffffff" opacity=".95"/></g>
    </g>
    <g class="eyes-closed" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M73 146 q7 5 14 0"/><path d="M113 146 q7 5 14 0"/>
    </g>
    <g class="eyes-happy" stroke="#2c4f7c" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M73 148 q7 -9 14 0"/><path d="M113 148 q7 -9 14 0"/>
    </g>
    <g class="eyes-laugh" stroke="#2c4f7c" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M73 148 q7 -9 14 0 M75 141 l-3 -2.5"/><path d="M113 148 q7 -9 14 0 M125 141 l3 -2.5"/>
    </g>
    <g class="eyes-alert">
      <circle cx="80" cy="144" r="9.5" fill="#ffffff" stroke="#2c4f7c" stroke-width="2"/>
      <circle cx="80" cy="144" r="3.6" fill="#2c4f7c"/>
      <circle cx="120" cy="144" r="9.5" fill="#ffffff" stroke="#2c4f7c" stroke-width="2"/>
      <circle cx="120" cy="144" r="3.6" fill="#2c4f7c"/>
    </g>
    <g class="eyes-wide">
      <ellipse cx="80" cy="144" rx="8.5" ry="10" fill="#ffffff" stroke="#2c4f7c" stroke-width="1.8"/>
      <circle cx="80" cy="145" r="3" fill="#2c4f7c"/>
      <ellipse cx="120" cy="144" rx="8.5" ry="10" fill="#ffffff" stroke="#2c4f7c" stroke-width="1.8"/>
      <circle cx="120" cy="145" r="3" fill="#2c4f7c"/>
    </g>
    <g class="eyes-sad">
      <ellipse cx="80" cy="148" rx="5.5" ry="7" fill="#2c4f7c"/>
      <ellipse cx="120" cy="148" rx="5.5" ry="7" fill="#2c4f7c"/>
      <path d="M71 143 Q80 138 89 142 L89 134 L71 134 Z" fill="url(#slimeG)"/>
      <path d="M111 142 Q120 138 129 143 L129 134 L111 134 Z" fill="url(#slimeG)"/>
    </g>
    <g class="brow-sad" stroke="#2c4f7c" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M71 136 L88 131"/><path d="M129 136 L112 131"/>
    </g>
    <g class="eyes-cry" stroke="#2c4f7c" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M73 144 Q80 150 87 144"/><path d="M113 144 Q120 150 127 144"/>
    </g>
    <g class="tears" fill="#8fd0f5" stroke="#4a9cc8" stroke-width="1.2">
      <path d="M74 150 Q71 160 75 164 Q79 160 77 150 Z"/>
      <path d="M126 150 Q129 160 125 164 Q121 160 123 150 Z"/>
    </g>
    <g class="eyes-spiral" stroke="#2c4f7c" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M80 145 m-6 0 a6 6 0 1 1 3 5 a3.4 3.4 0 1 1 3 -4.4"/>
      <path d="M120 145 m6 0 a6 6 0 1 0 -3 5 a3.4 3.4 0 1 0 -3 -4.4"/>
    </g>
    <g class="eyes-uneven">
      <ellipse cx="80" cy="145" rx="6" ry="9" fill="#2c4f7c"/><circle cx="78" cy="141" r="1.9" fill="#fff"/>
      <ellipse cx="120" cy="147" rx="4.6" ry="6" fill="#2c4f7c"/><circle cx="118.5" cy="144.5" r="1.5" fill="#fff"/>
    </g>
    <g class="eyes-up">
      <g class="pupL"><ellipse cx="81" cy="141" rx="5.6" ry="8" fill="#2c4f7c"/><circle cx="79" cy="137.5" r="1.9" fill="#fff"/></g>
      <g class="pupR"><ellipse cx="121" cy="141" rx="5.6" ry="8" fill="#2c4f7c"/><circle cx="119" cy="137.5" r="1.9" fill="#fff"/></g>
    </g>
    <g class="eyes-cool">
      <rect x="69" y="139" width="22" height="12" rx="5" fill="#1b2536" stroke="#0e1420" stroke-width="1.8"/>
      <rect x="109" y="139" width="22" height="12" rx="5" fill="#1b2536" stroke="#0e1420" stroke-width="1.8"/>
      <path d="M91 143 h18" stroke="#0e1420" stroke-width="2.2" fill="none"/>
      <path d="M72 142 l6 0 M112 142 l6 0" stroke="#7d9cc0" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
    </g>
    <g class="eyes-wink">
      <ellipse cx="80" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/><circle cx="78" cy="142" r="2.1" fill="#fff"/>
      <path d="M113 146 Q120 141 127 146" stroke="#2c4f7c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
    <g class="eyes-love" fill="#ff6d95">
      <path d="M80 152 C73 145 73 139 78 139 C80.5 139 80 142 80 142 C80 142 79.5 139 82 139 C87 139 87 145 80 152 Z"/>
      <path d="M120 152 C113 145 113 139 118 139 C120.5 139 120 142 120 142 C120 142 119.5 139 122 139 C127 139 127 145 120 152 Z"/>
    </g>
    <g class="eyes-angry">
      <ellipse cx="80" cy="147" rx="5.6" ry="7.5" fill="#2c4f7c"/><ellipse cx="120" cy="147" rx="5.6" ry="7.5" fill="#2c4f7c"/>
      <path d="M71 137 L90 142" stroke="#2c4f7c" stroke-width="3" stroke-linecap="round"/>
      <path d="M129 137 L110 142" stroke="#2c4f7c" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="eyes-sparkle">
      <ellipse cx="80" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/><ellipse cx="120" cy="146" rx="6" ry="9.5" fill="#2c4f7c"/>
      <path d="M80 140 l1.8 3.6 3.6 1.8 -3.6 1.8 -1.8 3.6 -1.8 -3.6 -3.6 -1.8 3.6 -1.8 Z" fill="#fff"/>
      <path d="M120 140 l1.8 3.6 3.6 1.8 -3.6 1.8 -1.8 3.6 -1.8 -3.6 -3.6 -1.8 3.6 -1.8 Z" fill="#fff"/>
    </g>
    <g class="eyes-half">
      <ellipse cx="80" cy="147" rx="6" ry="7.5" fill="#2c4f7c"/><ellipse cx="120" cy="147" rx="6" ry="7.5" fill="#2c4f7c"/>
      <path d="M72 143 Q80 139 88 142 L88 134 L72 134 Z" fill="url(#slimeG)"/>
      <path d="M112 142 Q120 139 128 143 L128 134 L112 134 Z" fill="url(#slimeG)"/>
    </g>

    <!-- ═══ MIỆNG — neo tại (100, 166) ═══ -->
    <path class="m-omega" d="M90 164 Q100 172 110 164" fill="none" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse class="m-o" cx="100" cy="168" rx="5" ry="6" fill="#2c4f7c"/>
    <ellipse class="m-big" cx="100" cy="170" rx="9" ry="13" fill="#2c4f7c"/>
    <path class="m-smile" d="M90 164 Q100 173 110 164" fill="none" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round"/>
    <path class="m-grin" d="M88 162 Q100 178 112 162 Q100 170 88 162 Z" fill="#2c4f7c"/>
    <path class="m-laugh" d="M88 162 Q100 162 112 162 Q109 178 100 178 Q91 178 88 162 Z" fill="#2c4f7c"/>
    <path class="m-frown" d="M91 170 Q100 163 109 170" fill="none" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round"/>
    <path class="m-cry" d="M92 165 Q100 160 108 165 Q106 176 100 176 Q94 176 92 165 Z" fill="#2c4f7c"/>
    <path class="m-wave" d="M90 167 Q95 163 100 167 Q105 171 110 167" fill="none" stroke="#2c4f7c" stroke-width="2.4" stroke-linecap="round"/>
    <path class="m-flat" d="M92 168 h16" stroke="#2c4f7c" stroke-width="2.4" stroke-linecap="round"/>
    <path class="m-smirk" d="M91 169 Q100 172 109 163" fill="none" stroke="#2c4f7c" stroke-width="2.6" stroke-linecap="round"/>

    <!-- ═══ PHỤ KIỆN BIỂU CẢM ═══ -->
    <g class="blush" fill="#ff8fb8" opacity=".3">
      <circle cx="66" cy="158" r="4.5"/><circle cx="134" cy="158" r="4.5"/>
    </g>
    <g class="blush-strong" fill="#ff7d95" opacity=".55">
      <ellipse cx="65" cy="158" rx="6" ry="3.6"/><ellipse cx="135" cy="158" rx="6" ry="3.6"/>
    </g>
    <g class="qmark" font-family="Segoe UI" font-size="22" font-weight="800" fill="#eaf5ff" stroke="#2c4f7c" stroke-width="1">
      <text x="150" y="60">?</text>
    </g>
    <g class="exmark" font-family="Segoe UI" font-size="22" font-weight="800" fill="#ffd23e" stroke="#2c4f7c" stroke-width="1">
      <text x="150" y="60">!</text>
    </g>
    <g class="sweat">
      <path d="M146 120 Q142 131 146 136 Q151 131 148 120 Z" fill="#8fd0f5" stroke="#4a9cc8" stroke-width="1.4"/>
    </g>
    <g class="sparkles" fill="#ffe9a8">
      <path d="M46 88 l1.8 3.8 3.8 1.8 -3.8 1.8 -1.8 3.8 -1.8 -3.8 -3.8 -1.8 3.8 -1.8 Z"/>
      <path d="M158 76 l1.5 3.2 3.2 1.5 -3.2 1.5 -1.5 3.2 -1.5 -3.2 -3.2 -1.5 3.2 -1.5 Z"/>
    </g>
    <g class="hearts" fill="#ff6d95">
      <path d="M50 70 C43 63 43 56 48 56 C50.5 56 50 59.5 50 59.5 C50 59.5 49.5 56 52 56 C57 56 57 63 50 70 Z"/>
      <path d="M154 80 C147 73 147 66 152 66 C154.5 66 154 69.5 154 69.5 C154 69.5 153.5 66 156 66 C161 66 161 73 154 80 Z"/>
    </g>
    <g class="notes" fill="#2c4f7c">
      <circle cx="48" cy="98" r="2.8"/><rect x="49.8" y="84" width="1.8" height="14"/>
      <circle cx="154" cy="104" r="2.4"/>
      <path d="M154 104 L154 91 Q160 93 160 97 Q157 95.5 154 96.5 Z"/>
    </g>
    <g class="steam" stroke="#bfe4ff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M60 56 Q55 49 60 42 Q65 35 60 28"/>
      <path d="M140 56 Q145 49 140 42 Q135 35 140 28"/>
    </g>
    <g class="sigh" fill="#ffffff" opacity=".75">
      <circle cx="124" cy="182" r="2.4"/><circle cx="131" cy="178" r="3.6"/><circle cx="140" cy="174" r="4.8"/>
    </g>
    <g class="flash">
      <rect x="0" y="0" width="200" height="240" fill="#eaf5ff" opacity=".85"/>
    </g>
  </g>
</svg>
