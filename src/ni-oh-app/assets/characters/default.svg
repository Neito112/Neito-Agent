            <ellipse class="m-o" cx="100" cy="152" rx="5" ry="6" fill="#2c4f7c"/>
            <path class="m-flat" d="M92 152 h16" stroke="#2c4f7c" stroke-width="2.4" stroke-linecap="round"/>
            <path class="m-grin" d="M88 146 Q100 162 112 146 Q100 154 88 146 Z" fill="#2c4f7c"/>
