<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ni-Oh Tactical Desktop Overlay Companion</title>
  <style>
    :root {
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #ff007f;
      --bg-glass: rgba(10, 15, 30, 0.75);
      --border-glow: rgba(0, 242, 254, 0.4);
      --text: #e0f7fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 24px;
    }

    /* ─── FLOATING COMPANION AVATAR CONTAINER ─── */
    .companion-widget {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 9999;
    }

    /* SPEECH BUBBLE */
    .speech-bubble {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow);
      border-radius: 16px 16px 4px 16px;
      padding: 12px 18px;
      max-width: 320px;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.5;
      box-shadow: 0 8px 32px rgba(0, 242, 254, 0.2);
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .speech-bubble.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .speech-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    /* FLOATING AVATAR SPHERE */
    .avatar-sphere {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00f2fe, #0052d4);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: float 4s ease-in-out infinite;
    }

    .avatar-sphere:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.9);
    }

    .avatar-core {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 15px #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: pulse 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* COMMAND POPUP BAR */
    .command-bar {
      position: absolute;
      bottom: 84px;
      right: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 340px;
      transform: translateY(20px) scale(0.9);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .command-bar.active {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .command-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .command-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
    }

    .action-btn {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      border: none;
      color: #000;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    /* KEYFRAME ANIMATIONS */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="companion-widget">
    <!-- Real-time Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">
      <div class="speech-meta">
        <span>🛡️ Ni-Oh Companion</span>
        <span id="speechTime">Live</span>
      </div>
      <div id="speechText">Sếp cần Ni-Oh hỗ trợ chiến thuật hay tính toán bài toán nào?</div>
    </div>

    <!-- Quick Tactical Command Bar -->
    <div class="command-bar" id="commandBar">
      <input type="text" class="command-input" id="cmdInput" placeholder="Nhập lệnh hoặc câu hỏi (Alt+Space)..." />
      <button class="action-btn" id="sendBtn">Gửi</button>
    </div>

    <!-- Floating Interactive Avatar -->
    <div class="avatar-sphere" id="avatarSphere" title="Nhấn để mở Tactical Command Bar">
      <div class="pulse-ring"></div>
      <div class="avatar-core">🛡️</div>
    </div>
  </div>

  <script>
    const avatar = document.getElementById('avatarSphere');
    const commandBar = document.getElementById('commandBar');
    const cmdInput = document.getElementById('cmdInput');
    const sendBtn = document.getElementById('sendBtn');
    const speechBubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');

    let isOpen = false;

    avatar.addEventListener('click', () => {
      isOpen = !isOpen;
      commandBar.classList.toggle('active', isOpen);
      if (isOpen) {
        cmdInput.focus();
        showSpeech('Ni-Oh đang lắng nghe Sếp...');
      }
    });

    sendBtn.addEventListener('click', sendCommand);
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendCommand();
    });

    // Phím tắt triệu hồi Alt + Space
    window.addEventListener('keydown', (e) => {
      if (e.altKey && e.code === 'Space') {
        e.preventDefault();
        isOpen = !isOpen;
        commandBar.classList.toggle('active', isOpen);
        if (isOpen) cmdInput.focus();
      }
    });

    async function sendCommand() {
      const q = cmdInput.value.trim();
      if (!q) return;

      showSpeech('⏳ Đang phân tích chiến lược...');
      cmdInput.value = '';

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: q })
        });
        const data = await res.json();
        showSpeech(data.reply || 'Đã hoàn thành phân tích.');
      } catch (err) {
        showSpeech('Lỗi kết nối tới Server Ni-Oh.');
      }
    }

    function showSpeech(text) {
      speechText.innerText = text;
      speechBubble.classList.add('active');
      clearTimeout(window.speechTimeout);
      window.speechTimeout = setTimeout(() => {
        speechBubble.classList.remove('active');
      }, 7000);
    }

    // Hiển thị lời chào khởi động
    setTimeout(() => {
      showSpeech('Sếp ơi, Ni-Oh Tactical Overlay đã sẵn sàng trên màn hình!');
    }, 1000);
  </script>
</body>
</html>
